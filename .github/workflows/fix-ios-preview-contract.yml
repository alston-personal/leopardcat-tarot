name: Fix iOS Preview Contract

on:
  push:
    branches:
      - fix/ios-share-renderer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-share-renderer
          fetch-depth: 1
          sparse-checkout: |
            website
            .github
      - name: Apply contract fix
        run: python .github/scripts/fix_ios_preview_contract.py
      - name: Run focused and contract tests
        run: |
          python -m pip install -q pytest
          pytest -q website/tests/test_ios_share_renderer.py website/tests/test_share_reading_state_monotonic.py website/tests/test_share_render_timeout.py
          pytest -q tests/test_reading_og_share_preview.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(share): preserve desktop preview contract without blocking iOS"
          git push origin HEAD:fix/ios-share-renderer
