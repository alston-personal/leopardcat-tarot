name: Apply Reading OG Share Preview
on:
  push:
    branches: [fix/reading-og-share-preview]
    paths:
      - 'tools/apply_reading_og_share_preview.py'
      - '.github/workflows/apply-reading-og-share-preview.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-og-share-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python tools/apply_reading_og_share_preview.py
      - name: Validate
        run: |
          python -m pip install -q pytest
          python -m py_compile website/fortune_server.py
          python -m pytest -q website/tests/test_reading_og_share_preview.py website/tests/test_deck_owned_share_theme.py website/tests/test_reading_based_share_reload.py
          node --check website/main.js
          cd website
          npm ci >/dev/null
          npm run build >/dev/null
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/fortune_server.py website/main.js website/tests/test_reading_og_share_preview.py governance/capabilities.json website/dist/index.html
          git commit -m 'fix(share): make reading links preview the rendered share card'
          git rm tools/apply_reading_og_share_preview.py .github/workflows/apply-reading-og-share-preview.yml
          git commit -m 'chore(ci): remove temporary reading OG patcher'
          git push origin HEAD:fix/reading-og-share-preview
