name: Fix Fan Width After Reading Card

on:
  push:
    branches: [feat/share-og-and-reading-controls]
    paths:
      - 'tools/fix_fan_width_after_reading_card.py'
      - '.github/workflows/fix-fan-width-after-reading-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/share-og-and-reading-controls
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify
        run: |
          set -euo pipefail
          python tools/fix_fan_width_after_reading_card.py
          python -m pip install -q pytest
          PYTHONPATH=website python -m pytest -q website/tests/test_share_og_and_reading_controls.py
          (cd website && PYTHONPATH=. python -m pytest -q tests/test_shuffle_manual_draw.py)
          node --check website/main.js
      - name: Build and browser regression
        working-directory: website
        run: |
          set -euo pipefail
          rm -rf public/art/renders public/cards
          mkdir -p public/art/renders public/cards
          npm ci
          npm run build
          nohup python fortune_server.py >/tmp/fan-width-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/api/v1/methods >/dev/null 2>&1 && break; sleep 1; done
          cd ..
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd website
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node tests/manual_draw_browser.mjs
      - name: Commit fix and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/fix_fan_width_after_reading_card.py .github/workflows/fix-fan-width-after-reading-card.yml
          git add website/main.js website/tests/test_share_og_and_reading_controls.py
          git add -u tools/fix_fan_width_after_reading_card.py .github/workflows/fix-fan-width-after-reading-card.yml
          git add -f website/dist/index.html
          git commit -m 'fix(ui): keep manual fan hit targets inside reading controls'
          git push origin HEAD:feat/share-og-and-reading-controls
