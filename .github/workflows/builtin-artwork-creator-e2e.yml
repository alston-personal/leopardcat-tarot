name: Builtin Artwork Creator E2E
on:
  push:
    branches: [feature/issue-80-reuse-leopardcat-images]
  pull_request:
    paths:
      - "website/public/create.html"
      - "website/public/creator.js"
      - "website/divination/publishing.py"
      - "website/tests/builtin_artwork_creator_e2e.mjs"
      - ".github/workflows/builtin-artwork-creator-e2e.yml"
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd website && npm ci && npm run build
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: cd website && python fortune_server.py > /tmp/leopardcat-e2e.log 2>&1 & 
      - run: node website/tests/builtin_artwork_creator_e2e.mjs
