name: Patch iOS Share Renderer

on:
  push:
    branches: [fix/ios-share-renderer]

permissions:
  contents: write

concurrency:
  group: patch-ios-share-renderer
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-share-renderer
          fetch-depth: 1
          sparse-checkout: |
            website
            docs
            .github
      - name: Apply deterministic iOS renderer
        shell: python
        run: |
          from pathlib import Path

          path = Path('website/main.js')
          src = path.read_text(encoding='utf-8')
          anchor = "// 📸 Share Image Generator\n"
          if src.count(anchor) != 1:
              raise SystemExit(f'expected one share generator anchor, found {src.count(anchor)}')

          helper = r'''function isIOSShareRuntime() {
    return /iP(?:hone|ad|od)/i.test(navigator.userAgent);
}

function roundedRectPath(ctx, x, y, width, height, radius) {
    const r = Math.max(0, Math.min(radius, width / 2, height / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
}

function canvasWrapLines(ctx, text, maxWidth, maxLines = 3) {
    const value = String(text || '').replace(/\s+/g, ' ').trim();
    if (!value) return [];
    const chars = Array.from(value);
    const lines = [];
    let line = '';
    for (const ch of chars) {
        const next = line + ch;
        if (line && ctx.measureText(next).width > maxWidth) {
            lines.push(line);
            line = ch;
            if (lines.length >= maxLines) break;
        } else {
            line = next;
        }
    }
    if (lines.length < maxLines && line) lines.push(line);
    if (lines.length === maxLines && chars.join('') !== lines.join('')) {
        let last = lines[maxLines - 1];
        while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
        lines[maxLines - 1] = `${last}…`;
    }
    return lines;
}

async function loadShareBitmap(src, timeoutMs = 5000) {
    if (!src) return null;
    return await Promise.race([
        new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.decoding = 'async';
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = src;
        }),
        new Promise(resolve => setTimeout(() => resolve(null), timeoutMs))
    ]);
}

async function renderMobileSafeSquareCanvas(shareContext, shareEntries, shareTheme, quote) {
    const size = 600;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) throw new Error('CANVAS2D_UNAVAILABLE');

    ctx.fillStyle = shareTheme.background || '#0a110e';
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = shareTheme.accent || '#d4af37';
    ctx.font = '600 25px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(shareTheme.title || window.brandText('share_title', 'Tarot Reading'), size / 2, 46);

    ctx.fillStyle = shareTheme.muted || 'rgba(245,242,236,.74)';
    ctx.font = '15px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
    const seeker = localStorage.getItem('userDharmaName') || 'Seeker';
    ctx.fillText(`${seeker} · ${new Date().toLocaleDateString(getAILanguageTag())}`, size / 2, 72);

    const count = shareEntries.length;
    const gap = count === 1 ? 0 : 14;
    const cardW = count === 1 ? 180 : 138;
    const cardH = count === 1 ? 292 : 224;
    const totalW = cardW * count + gap * Math.max(0, count - 1);
    const startX = (size - totalW) / 2;
    const cardY = 102;

    const loaded = await Promise.all(shareEntries.map(entry =>
        loadShareBitmap(getShareCardImage(entry.card, shareContext.deckId), 5000)
    ));

    shareEntries.forEach((entry, index) => {
        const x = startX + index * (cardW + gap);
        roundedRectPath(ctx, x - 4, cardY - 4, cardW + 8, cardH + 8, 12);
        ctx.fillStyle = shareTheme.surface || 'rgba(255,255,255,.055)';
        ctx.fill();
        ctx.strokeStyle = shareTheme.line || 'rgba(212,175,55,.28)';
        ctx.lineWidth = 2;
        ctx.stroke();

        const img = loaded[index];
        if (img && img.naturalWidth && img.naturalHeight) {
            const scale = Math.min(cardW / img.naturalWidth, cardH / img.naturalHeight);
            const dw = img.naturalWidth * scale;
            const dh = img.naturalHeight * scale;
            const cx = x + cardW / 2;
            const cy = cardY + cardH / 2;
            ctx.save();
            ctx.translate(cx, cy);
            if (entry.orientation === 'reversed') ctx.rotate(Math.PI);
            ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
        } else {
            ctx.fillStyle = shareTheme.surface || '#171717';
            ctx.fillRect(x, cardY, cardW, cardH);
            ctx.fillStyle = shareTheme.muted || '#ccc';
            ctx.font = '14px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
            ctx.fillText(getShareCardTitle(entry.card), x + cardW / 2, cardY + cardH / 2);
        }

        ctx.fillStyle = shareTheme.text || '#fff';
        ctx.font = `${count === 1 ? 16 : 13}px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif`;
        ctx.textAlign = 'center';
        const title = getShareCardTitle(entry.card);
        const orientation = entry.orientation === 'reversed' ? uiText('orientation_reversed', 'Reversed') : uiText('orientation_upright', 'Upright');
        const caption = count === 1 ? `${title} · ${orientation}` : `${index + 1}. ${title}${entry.orientation === 'reversed' ? ' ↕' : ''}`;
        const lines = canvasWrapLines(ctx, caption, cardW + 8, 2);
        lines.forEach((line, lineIndex) => ctx.fillText(line, x + cardW / 2, cardY + cardH + 24 + lineIndex * 17));
    });

    const quoteTop = count === 1 ? 444 : 392;
    ctx.textAlign = 'left';
    ctx.font = '18px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
    ctx.fillStyle = shareTheme.text || '#fff';
    const quoteLines = canvasWrapLines(ctx, `「${quote || ''}」`, 520, count === 1 ? 4 : 5);
    quoteLines.forEach((line, index) => ctx.fillText(line, 40, quoteTop + index * 26));

    ctx.textAlign = 'center';
    ctx.fillStyle = shareTheme.muted || 'rgba(245,242,236,.74)';
    ctx.font = '13px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
    ctx.fillText(shareTheme.site_tag || location.host, size / 2, 578);
    return canvas;
}

'''
          src = src.replace(anchor, helper + anchor, 1)

          old_square = """        const canvas = await renderShareCanvas(template, {\n            useCORS: true,\n            allowTaint: true,\n            logging: false,\n            backgroundColor: shareTheme.background,\n            scale: 1.0,\n            width: 600,\n            height: 600,\n            imageTimeout: 5000,\n            removeContainer: true\n        }, 'square');\n"""
          new_square = """        const canvas = isIOSShareRuntime()\n            ? await renderMobileSafeSquareCanvas(shareContext, shareEntries, shareTheme, quote)\n            : await renderShareCanvas(template, {\n                useCORS: true,\n                allowTaint: true,\n                logging: false,\n                backgroundColor: shareTheme.background,\n                scale: 1.0,\n                width: 600,\n                height: 600,\n                imageTimeout: 5000,\n                removeContainer: true\n            }, 'square');\n"""
          if src.count(old_square) != 1:
              raise SystemExit('square renderer anchor mismatch')
          src = src.replace(old_square, new_square, 1)

          old_og = """        let ogBlob = blob;\n        template.classList.add('share-og-mode');\n        try {\n            const ogCanvas = await renderShareCanvas(template, {\n                useCORS: true,\n                allowTaint: true,\n                logging: false,\n                backgroundColor: shareTheme.background,\n                scale: 1.0,\n                width: 1200,\n                height: 630,\n                imageTimeout: 5000,\n                removeContainer: true\n            }, 'og');\n            const renderedOgBlob = await new Promise(resolve => ogCanvas.toBlob(resolve, 'image/png'));\n            if (renderedOgBlob) ogBlob = renderedOgBlob;\n        } finally {\n            template.classList.remove('share-og-mode');\n        }\n        await persistReadingSharePreview(ogBlob); // OG receives the landscape asset; private text is still excluded.\n"""
          new_og = """        let ogBlob = blob;\n        // Native iOS sharing must never wait for a second DOM raster. The square Canvas2D\n        // asset is persisted as a safe preview fallback; desktop keeps the landscape OG path.\n        if (!isIOSShareRuntime()) {\n            template.classList.add('share-og-mode');\n            try {\n                const ogCanvas = await renderShareCanvas(template, {\n                    useCORS: true,\n                    allowTaint: true,\n                    logging: false,\n                    backgroundColor: shareTheme.background,\n                    scale: 1.0,\n                    width: 1200,\n                    height: 630,\n                    imageTimeout: 5000,\n                    removeContainer: true\n                }, 'og');\n                const renderedOgBlob = await new Promise(resolve => ogCanvas.toBlob(resolve, 'image/png'));\n                if (renderedOgBlob) ogBlob = renderedOgBlob;\n            } catch (ogError) {\n                console.warn('[Share] OG render unavailable; native share remains valid', ogError);\n            } finally {\n                template.classList.remove('share-og-mode');\n            }\n        }\n        void persistReadingSharePreview(ogBlob); // preview persistence is best-effort and never blocks native share.\n"""
          if src.count(old_og) != 1:
              raise SystemExit('OG renderer anchor mismatch')
          src = src.replace(old_og, new_og, 1)
          path.write_text(src, encoding='utf-8')

          test = Path('website/tests/test_ios_share_renderer.py')
          test.write_text(r'''from pathlib import Path


def source():
    return Path(__file__).parents[1].joinpath('main.js').read_text(encoding='utf-8')


def test_ios_square_uses_deterministic_canvas2d_renderer():
    src = source()
    assert 'async function renderMobileSafeSquareCanvas' in src
    assert '? await renderMobileSafeSquareCanvas(shareContext, shareEntries, shareTheme, quote)' in src
    assert "renderShareCanvas(template" in src  # retained for non-iOS/OG only


def test_ios_native_share_does_not_wait_for_og_dom_raster():
    src = source()
    assert "if (!isIOSShareRuntime())" in src
    assert 'void persistReadingSharePreview(ogBlob)' in src
    assert "console.warn('[Share] OG render unavailable; native share remains valid'" in src


def test_renderer_preserves_spread_orientation_from_canonical_entries():
    src = source()
    assert 'shareEntries.forEach((entry, index)' in src
    assert "if (entry.orientation === 'reversed') ctx.rotate(Math.PI);" in src
    assert 'getShareCardImage(entry.card, shareContext.deckId)' in src
    assert 'updateSocialLinks(currentDrawnCard, bestQuote);' not in src
''', encoding='utf-8')

          exp = Path('docs/experience/IOS_SHARE_RENDERER_CEIR_FIXTURE.md')
          exp.parent.mkdir(parents=True, exist_ok=True)
          exp.write_text('''# CEIR Teacher Fixture — iOS share renderer timeout\n\n## Hypothesis that failed\nMobile Safari was assumed to be merely slower than desktop, so the square render budget was raised from 20s to 60s.\n\n## Falsifying production evidence\nA real iPhone produced `[RENDER_ERR] TIMEOUT:square:60000`, proving the DOM raster itself can stall beyond the enlarged budget.\n\n## Architectural correction\nFor iOS native sharing, square PNG generation is now derived directly from canonical `shareContext/shareEntries` through Canvas2D. `html2canvas` is no longer authoritative for the iOS native-share asset. OG generation/persistence is best-effort and cannot block native share.\n\n## Protected invariants\n- N-card reading remains N cards in the image.\n- Orientation is rendered from canonical entry orientation.\n- A lossy `currentDrawnCard` projection cannot re-author spread share state.\n- Increasing timeout again is a superseded path unless new evidence establishes a different bounded wait.\n- Preview/OG failure cannot deny native-share capability.\n\n## Code Evolution IR mapping\n- hypothesis: Mobile Safari render is healthy but slow\n- observation: 60s square timeout on real iPhone\n- result: hypothesis falsified\n- failed_path: increase DOM-raster timeout\n- decision: deterministic Canvas2D renderer from canonical reading state\n- forbidden_transition: canonical spread state -> DOM/current-card lossy projection -> authoritative native share\n''', encoding='utf-8')

          Path('.github/workflows/patch-ios-share-renderer.yml').unlink()
      - name: Run focused tests
        run: |
          python -m pip install -q pytest
          pytest -q website/tests/test_ios_share_renderer.py website/tests/test_share_reading_state_monotonic.py website/tests/test_share_render_timeout.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(share): render iOS square memo from canonical state"
          git push origin HEAD:fix/ios-share-renderer
