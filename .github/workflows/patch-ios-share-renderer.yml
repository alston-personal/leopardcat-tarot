name: Patch iOS Share Renderer

on:
  push:
    branches:
      - fix/ios-share-renderer

permissions:
  contents: write

concurrency:
  group: patch-ios-share-renderer
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-share-renderer
          fetch-depth: 1
          sparse-checkout: |
            website
            docs
            .github
      - name: Apply patch
        run: python .github/scripts/patch_ios_share_renderer_v2.py
      - name: Run focused tests
        run: |
          python -m pip install -q pytest
          pytest -q website/tests/test_ios_share_renderer.py website/tests/test_share_reading_state_monotonic.py website/tests/test_share_render_timeout.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(share): render iOS square memo from canonical state"
          git push origin HEAD:fix/ios-share-renderer
