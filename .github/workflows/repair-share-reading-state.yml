name: Repair Share Reading State

on:
  push:
    branches:
      - fix/share-reading-state-regression-v2

permissions:
  contents: write

concurrency:
  group: repair-share-reading-state
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-reading-state-regression-v2
          fetch-depth: 1
          sparse-checkout: |
            website
            docs
            .github
            .ci
      - name: Repair canonical share flow and add regression contract
        shell: python
        run: |
          from pathlib import Path

          main = Path('website/main.js')
          src = main.read_text(encoding='utf-8')
          needle = '        updateSocialLinks(currentDrawnCard, bestQuote);\n'
          if src.count(needle) != 1:
              raise SystemExit(f'expected exactly one legacy share overwrite, found {src.count(needle)}')
          replacement = """        // Share links above were already derived from canonical reading-level state.\n        // Never re-author an active reading from currentDrawnCard: that lossy legacy\n        // projection collapses multi-card spreads back to one card (often the first).\n        if (shareEntries.length === 1 && !window.currentReadingState && !window.currentReadingEnvelope) {\n            updateSocialLinks(shareEntries[0].card, bestQuote);\n        }\n"""
          main.write_text(src.replace(needle, replacement, 1), encoding='utf-8')

          test = Path('website/tests/test_share_reading_state_monotonic.py')
          test.write_text("""from pathlib import Path\n\n\ndef test_spread_share_state_cannot_be_reauthored_from_current_drawn_card():\n    src = Path(__file__).parents[1].joinpath('main.js').read_text(encoding='utf-8')\n    assert 'if (shareEntries.length === 1 && !window.currentReadingState && !window.currentReadingEnvelope)' in src\n    assert 'updateSocialLinks(shareEntries[0].card, bestQuote);' in src\n    assert 'updateSocialLinks(currentDrawnCard, bestQuote);' not in src\n\n\ndef test_three_card_share_is_derived_from_reading_entries():\n    src = Path(__file__).parents[1].joinpath('main.js').read_text(encoding='utf-8')\n    assert 'const shareEntries = shareContext.cards;' in src\n    assert 'shareEntries.map(entry =>' in src\n    assert 'renderShareCards(shareFrame, shareContext);' in src\n    assert "shareEntries.length === 1" in src\n""", encoding='utf-8')

          exp = Path('docs/experience/SHARE_STATE_MONOTONICITY.md')
          exp.parent.mkdir(parents=True, exist_ok=True)
          exp.write_text("""# Experience IR — Share State Monotonicity\n\n## Failure signature\n\nA multi-card reading was correctly rendered from reading-level state, then a downstream legacy helper rebuilt social metadata from `currentDrawnCard`, collapsing the result to one card (often the first card). In parallel, deployment/parity ambiguity made the regression look like an old bundle had overwritten a newer one.\n\n## Root cause\n\nThe system had multiple writers for the same semantic output: the canonical reading-level share context and a legacy single-card helper. Tests proved that the new spread-aware capability existed, but did not prove that later code could not downgrade it.\n\n## Canonical rule\n\n`reading receipt/state -> resolved share context -> rendered cards + share URL/text` is the only authoritative chain for an active reading. Once reading-level state exists, downstream helpers may format it but must not re-author it from `currentDrawnCard` or another lossy projection.\n\n## Regression invariant\n\nFor an N-card reading, every share surface must preserve N-card identity unless a surface has an explicit documented reduction contract. A generic legacy helper is not such a contract.\n\n## Merge gate\n\nAny change touching reading, share, social metadata, deep links, rendering, or deployment must preserve:\n\n1. reading-level state is authoritative;\n2. three-card readings render three cards;\n3. share text is derived from all reading entries;\n4. receipt/deep-link identity wins over single-card fallback;\n5. no later call may overwrite spread-aware state from `currentDrawnCard`;\n6. production evidence must identify exact deployed SHA/artifact before a regression is classified as fixed.\n\n## Generalized lesson\n\nCapability tests must be monotonic, not merely existential. Do not only assert “new capability is present”; assert “no later legacy path can reduce or overwrite it.” When old and new representations coexist, define one canonical writer and turn every other path into a read-only adapter.\n""", encoding='utf-8')

          Path('.github/workflows/repair-share-reading-state.yml').unlink()
          Path('.ci/share-reading-state-trigger').unlink(missing_ok=True)
      - name: Run focused share regression tests
        run: |
          python -m pip install -q pytest
          pytest -q website/tests/test_share_reading_state_monotonic.py website/tests/test_share_render_timeout.py
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(share): preserve canonical reading-level share state"
          git push origin HEAD:fix/share-reading-state-regression-v2
