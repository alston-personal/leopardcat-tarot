name: Apply Groq Multi-model Fallback
on:
  workflow_dispatch:
  push:
    branches: [fix/groq-multi-model-fallback]
    paths:
      - 'tools/apply_groq_multi_model_fallback.py'
      - '.github/workflows/apply-groq-multi-model-fallback.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groq-multi-model-fallback
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply patch
        run: python tools/apply_groq_multi_model_fallback.py
      - name: Validate
        run: |
          cd website
          python -m pytest -q tests/test_groq_multi_model_fallback.py tests/test_ai_gateway.py || python -m pytest -q tests/test_groq_multi_model_fallback.py
          python -m py_compile divination/ai_gateway.py fortune_server.py
      - name: Commit product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/divination/ai_gateway.py website/fortune_server.py website/tests/test_groq_multi_model_fallback.py
          git commit -m 'fix(master): add Groq model fallbacks for free-tier exhaustion'
          git push origin HEAD:fix/groq-multi-model-fallback
