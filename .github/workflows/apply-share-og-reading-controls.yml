name: Apply Share OG And Reading Controls

on:
  push:
    branches: [feat/share-og-and-reading-controls]
    paths:
      - 'tools/apply_share_og_reading_controls.py'
      - '.github/workflows/apply-share-og-reading-controls.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/share-og-and-reading-controls
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply product patch
        run: |
          set -euo pipefail
          python tools/apply_share_og_reading_controls.py
          python - <<'PY'
          from pathlib import Path

          server = Path('website/fortune_server.py')
          s = server.read_text(encoding='utf-8')
          old = 'meta_img_width = meta_img_height = 600'
          if old not in s:
              raise SystemExit('persisted OG dimension anchor missing')
          server.write_text(s.replace(old, 'meta_img_width, meta_img_height = 1200, 630', 1), encoding='utf-8')

          p = Path('website/tests/test_reading_og_share_preview.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("assert \"meta_img_width = meta_img_height = 600\" in server", "assert \"meta_img_width, meta_img_height = 1200, 630\" in server", 1)
          s = s.replace("assert \"await persistReadingSharePreview(blob);\" in js", "assert \"await persistReadingSharePreview(ogBlob);\" in js", 1)
          s = s.replace("assert js.index('await persistReadingSharePreview(blob);') < js.index('navigator.share({', js.index('await persistReadingSharePreview(blob);'))", "assert js.index('await persistReadingSharePreview(ogBlob);') < js.index('navigator.share({', js.index('await persistReadingSharePreview(ogBlob);'))", 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m pip install -q pytest
          PYTHONPATH=website python -m pytest -q \
            website/tests/test_share_og_and_reading_controls.py \
            website/tests/test_reading_og_share_preview.py \
            website/tests/test_deck_owned_share_theme.py
          (cd website && PYTHONPATH=. python -m pytest -q tests/test_shuffle_manual_draw.py)
          node --check website/main.js
      - name: Build committed frontend
        working-directory: website
        run: |
          set -euo pipefail
          rm -rf public/art/renders public/cards
          mkdir -p public/art/renders public/cards
          npm ci
          npm run build
      - name: Commit product change and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/apply_share_og_reading_controls.py .github/workflows/apply-share-og-reading-controls.yml
          git add governance/capabilities.json website/index.html website/main.js website/style.css website/fortune_server.py \
            website/tests/test_share_og_and_reading_controls.py website/tests/test_reading_og_share_preview.py
          git add -u tools/apply_share_og_reading_controls.py .github/workflows/apply-share-og-reading-controls.yml
          git add -f website/dist/index.html
          git commit -m 'feat(ui): refine reading setup and social share preview'
          git push origin HEAD:feat/share-og-and-reading-controls
