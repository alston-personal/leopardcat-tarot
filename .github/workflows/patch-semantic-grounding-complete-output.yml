name: Patch semantic grounding and complete output

on:
  push:
    branches: [fix/semantic-grounding-complete-output]
    paths:
      - '.github/workflows/patch-semantic-grounding-complete-output.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-grounding-complete-output
          fetch-depth: 0
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply patch
        run: python tools/patch_semantic_grounding_complete_output.py
      - name: Focused tests
        working-directory: website
        run: |
          python -m pytest -q tests/test_semantic_grounding_complete_output.py tests/test_provider_pool_quality.py tests/test_ai_gateway_fail_closed.py
          python -m py_compile fortune_server.py divination/*.py
      - name: Capability guard
        run: python scripts/check_capability_regressions.py
      - name: Commit product patch and remove temporary tooling
        run: |
          rm -f tools/patch_semantic_grounding_complete_output.py .github/workflows/patch-semantic-grounding-complete-output.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ai): ground meanings and reject truncated readings'
          git push origin HEAD:fix/semantic-grounding-complete-output
