name: Patch shuffle manual draw

on:
  push:
    branches: [feature/shuffle-manual-draw]
    paths:
      - '.github/workflows/patch-shuffle-manual-draw.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shuffle-manual-draw
          fetch-depth: 0
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply patch
        run: python tools/patch_shuffle_manual_draw.py
      - name: Focused tests
        working-directory: website
        run: |
          python -m pytest -q tests/test_shuffle_manual_draw.py tests/test_deck_driven_share_spreads.py tests/test_reading_based_share_reload.py tests/test_ai_gateway_fail_closed.py
          python -m py_compile fortune_server.py divination/*.py
      - name: Capability guard
        run: python scripts/check_capability_regressions.py
      - name: Build frontend
        working-directory: website
        run: |
          if [ ! -d public/art/renders ]; then rm -f public/art/renders; mkdir -p public/art/renders; fi
          npm ci
          npm run build
      - name: Commit product patch and remove temporary tooling
        run: |
          rm -f tools/patch_shuffle_manual_draw.py .github/workflows/patch-shuffle-manual-draw.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(reading): add shared shuffle and manual draw engine'
          git push origin HEAD:feature/shuffle-manual-draw
