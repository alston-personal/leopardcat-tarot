name: Apply Card Wheel Priority Fix
on:
  push:
    branches: [main]
    paths: [tools/patch_card_wheel_priority.py, .github/workflows/apply-card-wheel-priority.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch_card_wheel_priority.py
      - name: Validate
        run: |
          node --check website/main.js
          grep -q 'panelCanConsume' website/main.js
          grep -q 'passive: false' website/main.js
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/main.js
          if git diff --cached --quiet; then echo no_changes=true; exit 0; fi
          git commit -m "fix(ui): give card meanings wheel priority"
          git push origin HEAD:main
