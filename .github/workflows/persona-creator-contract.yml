name: Persona Creator Contract

on:
  push:
    branches: [feature/persona-creator]

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persona-creator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime patch
        run: python tools/patch_persona_creator_runtime.py
      - name: Validate Persona Pack publisher
        working-directory: website
        run: |
          python - <<'PY'
          import json
          import tempfile
          from divination.persona_publishing import PersonaPublisher
          from divination.personas import ConfigurablePersona

          with tempfile.TemporaryDirectory() as td:
              pub = PersonaPublisher(td)
              out = pub.publish({
                  'name':'月光園丁',
                  'role':'溫柔但不逃避現實的夜間引路人',
                  'voice':'溫柔、簡潔\n先同理，再指出盲點',
                  'principles':'先讀牌面，再連回提問\n最後給一個今天能做的行動',
                  'worldview':'熟悉植物與季節循環',
                  'closing':'最後留下一句短短的月光提醒',
              })
              assert out['source'] == 'custom'
              assert out['persona_id'].startswith('persona-')
              pack_path = pub.pack_path(out['persona_id'])
              pack = json.loads(pack_path.read_text(encoding='utf-8'))
              assert pack['source'] == 'custom'
              assert pack['methods'] == ['tarot']
              assert len(pack['safety']) >= 3
              persona = ConfigurablePersona(pack_path)
              info = persona.public_info()
              assert info['name'] == '月光園丁'
              assert info['source'] == 'custom'
              prompt = persona.build_prompt(method_result={'cards':[{'id':'x'}]}, question='我該注意什麼？', lang='zh-TW')
              assert 'PLATFORM RULES' in prompt
              assert 'FINAL PLATFORM REMINDER' in prompt
              assert '月光園丁' in prompt
          print('persona_creator_publisher_contract=passed')
          PY
      - name: Validate source and build
        run: |
          python -m py_compile website/fortune_server.py website/divination/*.py
          node --check website/public/creator.js
          grep -q '建立我的解牌師' website/public/create.html
          grep -q "fetch('/api/v1/personas'" website/public/creator.js
          grep -q "path.startswith('/api/v1/personas/')" website/fortune_server.py
          grep -q "source') != 'custom'" website/fortune_server.py
          cd website
          rm -f public/art/renders public/cards
          mkdir -p public/art/renders public/cards
          npm ci
          npm run build
          echo persona_creator_source_contract=passed
      - name: Commit generated runtime source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/fortune_server.py website/public/create.html website/public/creator.js
          if git diff --cached --quiet; then
            echo persona_creator_source_already_current=passed
          else
            git commit -m 'feat(persona): wire structured persona creator runtime'
            git push origin HEAD:feature/persona-creator
          fi
