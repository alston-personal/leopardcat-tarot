name: Capability Regression Guard

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

jobs:
  preserve-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check protected capability contracts
        run: python scripts/check_capability_regressions.py
      - name: Prevent capability ledger shrinkage
        run: python scripts/check_capability_ledger_monotonic.py
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Verify Gemini zero-cost fail-closed gateway
        env:
          PYTHONPATH: website
        run: python -m pytest -q website/tests/test_ai_gateway_fail_closed.py
