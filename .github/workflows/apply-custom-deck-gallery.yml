name: Apply Custom Deck Gallery
on:
  push:
    branches: [main]
    paths:
      - 'tools/add_custom_deck_gallery.py'
      - '.github/workflows/apply-custom-deck-gallery.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/add_custom_deck_gallery.py
      - name: Validate
        run: |
          node --check website/main.js
          grep -q 'renderCustomDeckGallery' website/main.js
          grep -q '牌卡展示' website/main.js
          grep -q 'window.cardData = Array.isArray(deck.cards)' website/main.js
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/main.js
          git commit -m "feat(ui): show custom deck card gallery"
          git pull --rebase origin main
          git push origin HEAD:main
