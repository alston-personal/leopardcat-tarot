name: Apply Published History Scroll Fix

on:
  push:
    branches: [main]
    paths: [tools/patch_published_history_scroll.py, .github/workflows/apply-published-history-scroll.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch_published_history_scroll.py
      - name: Validate
        run: |
          node --check website/public/creator.js
          node --check website/main.js
          python -m py_compile website/fortune_server.py website/divination/*.py
          cd website
          rm -rf node_modules
          npm ci
          npm run build
      - name: Restore validation-only files
        run: git checkout -- website/dist website/node_modules 2>/dev/null || true
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/create.html website/public/creator.js website/main.js website/style.css
          if git diff --cached --quiet; then echo no_changes=true; exit 0; fi
          git commit -m "fix(ui): remember published decks and scroll long meanings"
          git push origin HEAD:main
