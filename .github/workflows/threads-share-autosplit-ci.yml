name: Threads Share Autosplit CI
on:
  push:
    branches: [feat/threads-share-and-autosplit]
    paths:
      - 'tools/apply_threads_share_autosplit.py'
      - '.github/workflows/threads-share-autosplit-ci.yml'
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/threads-share-and-autosplit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: python tools/apply_threads_share_autosplit.py
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run focused regression
        run: pytest -q website/tests/test_threads_share_autosplit.py website/tests/test_full_master_share.py
      - name: Syntax and build
        run: |
          python -m py_compile website/fortune_server.py
          node --check website/main.js
          mkdir -p website/public/art/renders
          cd website
          npm ci
          npm run build
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/fortune_server.py website/tests/test_threads_share_autosplit.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(threads): resolve share URLs and long post flow'
          git push origin HEAD:feat/threads-share-and-autosplit
