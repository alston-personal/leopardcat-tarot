name: Oracle Runtime Inspector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracle-runtime-inspector.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, oracle]
    timeout-minutes: 3
    steps:
      - name: Inspect LeopardCat production runtime read-only
        shell: bash
        run: |
          set -u
          echo '=== identity ==='
          id || true
          hostname || true
          pwd || true

          echo '=== port 8088 ==='
          ss -ltnp '( sport = :8088 )' 2>/dev/null || ss -ltnp 2>/dev/null | grep ':8088' || true

          pids="$(ss -ltnp 2>/dev/null | sed -n 's/.*:8088 .*pid=\([0-9][0-9]*\).*/\1/p' | sort -u)"
          for pid in $pids; do
            echo "--- pid=$pid ---"
            readlink -f "/proc/$pid/cwd" 2>/dev/null || true
            tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
            echo
            readlink -f "/proc/$pid/exe" 2>/dev/null || true
          done

          echo '=== likely processes ==='
          ps -eo pid,user,lstart,args | grep -E '[f]ortune_server.py|[l]eopardcat|[p]ython.*8088' || true

          echo '=== systemd units ==='
          systemctl --user --no-pager --type=service --all 2>/dev/null | grep -Ei 'leopard|tarot|fortune' || true
          systemctl --no-pager --type=service --all 2>/dev/null | grep -Ei 'leopard|tarot|fortune' || true

          echo '=== candidate repositories ==='
          for base in "$HOME" /home/ubuntu /opt /srv /var/www; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 4 -type d -name .git -print 2>/dev/null | while read -r gitdir; do
              repo="${gitdir%/.git}"
              remote="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
              case "$remote $repo" in
                *leopardcat-tarot*|*leopardcat*tarot*)
                  echo "repo=$repo"
                  echo "remote=$remote"
                  echo "head=$(git -C "$repo" rev-parse HEAD 2>/dev/null || true)"
                  echo "branch=$(git -C "$repo" branch --show-current 2>/dev/null || true)"
                  echo "dirty=$(git -C "$repo" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
                  ;;
              esac
            done
          done

          echo '=== local policy endpoint ==='
          curl -fsS --max-time 5 http://127.0.0.1:8088/api/v1/ai-policy || true
          echo
