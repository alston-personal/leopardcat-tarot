name: Apply Manual Fan Shuffle

on:
  push:
    branches: [feat/manual-fan-shuffle]
    paths:
      - '.github/workflows/apply-manual-fan-shuffle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-fan-shuffle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch manual shuffle state and fan geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('website/main.js')
          main = main_path.read_text(encoding='utf-8')

          main = main.replace(
              "window.manualDrawState = { seed: null, selected: [], shuffled: false, submitting: false };",
              "window.manualDrawState = { seed: null, selected: [], shuffled: false, submitting: false, phase: 'idle' };",
          )

          old_status = """function manualStatus() {
              const el = document.getElementById('manual-draw-status');
              if (!el) return;
              if (!window.manualDrawState.shuffled) {
                  el.textContent = uiText('manual_draw_shuffle_first', 'Shuffle first, then choose your cards.');
                  return;
              }
              const need = requiredDrawCount();
              const selected = window.manualDrawState.selected.length;
              el.textContent = uiText('manual_draw_progress', 'Selected {selected} / {need}', {selected, need});
          }"""
          new_status = """function manualStatus() {
              const el = document.getElementById('manual-draw-status');
              if (!el) return;
              if (window.manualDrawState.phase === 'shuffling') {
                  el.textContent = uiText('manual_draw_shuffling', '洗牌中…');
                  return;
              }
              if (!window.manualDrawState.shuffled) {
                  el.textContent = uiText('manual_draw_shuffle_first', 'Shuffle first, then choose your cards.');
                  return;
              }
              const need = requiredDrawCount();
              const selected = window.manualDrawState.selected.length;
              el.textContent = uiText('manual_draw_progress', 'Selected {selected} / {need}', {selected, need});
          }"""
          if old_status not in main:
              raise SystemExit('manualStatus block not found')
          main = main.replace(old_status, new_status, 1)

          old_index = """        button.dataset.drawIndex = String(i);
                  button.setAttribute('aria-label', uiText('manual_card_aria', 'Choose card position {index}', {index:i}));"""
          new_index = """        button.dataset.drawIndex = String(i);
                  const fanPosition = total > 1 ? ((i - 1) / (total - 1)) * 2 - 1 : 0;
                  const fanAngle = fanPosition * 31;
                  const fanX = fanPosition * Math.min(340, Math.max(180, total * 7));
                  const fanY = Math.pow(Math.abs(fanPosition), 1.65) * 72;
                  button.style.setProperty('--fan-x', `${fanX.toFixed(1)}px`);
                  button.style.setProperty('--fan-y', `${fanY.toFixed(1)}px`);
                  button.style.setProperty('--fan-angle', `${fanAngle.toFixed(2)}deg`);
                  button.style.setProperty('--fan-mobile-angle', `${(fanAngle * 0.18).toFixed(2)}deg`);
                  button.style.setProperty('--fan-z', String(i));
                  button.style.setProperty('--shuffle-shift', `${i % 2 ? 34 : -34}px`);
                  button.style.setProperty('--shuffle-delay', `${(i % 9) * 16}ms`);
                  button.setAttribute('aria-label', uiText('manual_card_aria', 'Choose card position {index}', {index:i}));"""
          if old_index not in main:
              raise SystemExit('manual card index block not found')
          main = main.replace(old_index, new_index, 1)

          old_shuffle = """window.shuffleManualDeck = function() {
              const q = document.getElementById('fortune-question')?.value?.trim() || '';
              if (!q) return alert(uiText('err_empty_question', 'Please enter your question first.'));
              window.manualDrawState = { seed: freshShuffleSeed(), selected: [], shuffled: true, submitting: false };
              renderManualCardPool();
              const pool = document.getElementById('manual-card-pool');
              pool?.classList.remove('is-shuffling');
              void pool?.offsetWidth;
              pool?.classList.add('is-shuffling');
              setTimeout(() => pool?.classList.remove('is-shuffling'), 650);
          };"""
          new_shuffle = """window.shuffleManualDeck = function() {
              const q = document.getElementById('fortune-question')?.value?.trim() || '';
              if (!q) return alert(uiText('err_empty_question', 'Please enter your question first.'));
              const seed = freshShuffleSeed();
              window.manualDrawState = { seed, selected: [], shuffled: false, submitting: false, phase: 'shuffling' };
              renderManualCardPool();
              const pool = document.getElementById('manual-card-pool');
              const shuffleButton = document.getElementById('btn-manual-shuffle');
              pool?.classList.remove('is-shuffling');
              void pool?.offsetWidth;
              pool?.classList.add('is-shuffling');
              if (shuffleButton) shuffleButton.disabled = true;
              manualStatus();
              const duration = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 240 : 1050;
              setTimeout(() => {
                  if (window.manualDrawState.seed !== seed || window.drawMode !== 'manual') return;
                  window.manualDrawState.shuffled = true;
                  window.manualDrawState.phase = 'ready_to_draw';
                  pool?.classList.remove('is-shuffling');
                  if (shuffleButton) shuffleButton.disabled = false;
                  manualStatus();
              }, duration);
          };"""
          if old_shuffle not in main:
              raise SystemExit('shuffleManualDeck block not found')
          main = main.replace(old_shuffle, new_shuffle, 1)

          main_path.write_text(main, encoding='utf-8')

          style_path = Path('website/style.css')
          style = style_path.read_text(encoding='utf-8')
          marker = '/* Shared Draw Engine UI: shuffle is presentation; selection indices feed the same server draw(). */'
          if marker not in style:
              raise SystemExit('manual draw CSS marker not found')
          prefix = style.split(marker, 1)[0]
          manual_css = r'''/* Shared Draw Engine UI: shuffle is presentation; selection indices feed the same server draw(). */
          .draw-mode-picker { margin-top: 8px; }
          .manual-draw-stage { margin: 14px 0 4px; }
          .manual-draw-toolbar { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
          .manual-draw-status { font-size:.76rem; opacity:.82; min-height:1.2em; }

          /* Desktop ritual table: the immutable 1-based draw positions are only presented as a fan. */
          .manual-card-pool {
            position:relative;
            display:block;
            height:270px;
            max-height:none;
            overflow:visible;
            padding:18px 12px 8px;
            border:1px solid rgba(212,175,55,.22);
            border-radius:18px;
            background:radial-gradient(ellipse at 50% 100%, rgba(212,175,55,.07), rgba(0,0,0,.23) 58%, rgba(0,0,0,.33));
            isolation:isolate;
          }
          .manual-card-pool::before {
            content:'';
            position:absolute;
            inset:auto 12% 12px;
            height:38%;
            border:1px solid rgba(212,175,55,.11);
            border-radius:50%;
            filter:blur(.2px);
            pointer-events:none;
          }
          .manual-card-back {
            appearance:none;
            position:absolute;
            left:50%;
            bottom:22px;
            width:72px;
            height:120px;
            margin-left:-36px;
            border:0;
            padding:0;
            background:transparent;
            border-radius:7px;
            cursor:pointer;
            transform-origin:50% 145%;
            transform:translateX(var(--fan-x,0px)) translateY(var(--fan-y,0px)) rotate(var(--fan-angle,0deg));
            z-index:var(--fan-z,1);
            transition:transform .22s cubic-bezier(.2,.8,.2,1), filter .18s ease, opacity .18s ease;
            touch-action:manipulation;
          }
          .manual-card-back img { width:100%; height:100%; display:block; object-fit:cover; border-radius:7px; box-shadow:0 7px 16px rgba(0,0,0,.55); user-select:none; pointer-events:none; }
          .manual-card-back:hover, .manual-card-back:focus-visible {
            transform:translateX(var(--fan-x,0px)) translateY(calc(var(--fan-y,0px) - 24px)) rotate(var(--fan-angle,0deg)) scale(1.09);
            z-index:500;
            outline:2px solid var(--color-gold);
            outline-offset:3px;
          }
          .manual-card-back.selected {
            transform:translateX(var(--fan-x,0px)) translateY(calc(var(--fan-y,0px) - 42px)) rotate(var(--fan-angle,0deg)) scale(1.1);
            z-index:450;
            filter:drop-shadow(0 0 9px rgba(212,175,55,.9));
            opacity:.78;
          }
          .manual-card-back.selected img { outline:2px solid var(--color-gold); outline-offset:2px; }
          .manual-card-back:disabled { cursor:default; }

          /* Real shuffle phase: collapse, cross, then redeal. Draw selection stays locked until this ends. */
          .manual-card-pool.is-shuffling { pointer-events:none; }
          .manual-card-pool.is-shuffling .manual-card-back {
            animation:ritual-fan-shuffle 1.02s cubic-bezier(.22,.72,.18,1) both;
            animation-delay:var(--shuffle-delay,0ms);
          }
          .manual-card-pool.is-shuffling::after {
            content:'';
            position:absolute;
            left:50%;
            top:49%;
            width:118px;
            height:118px;
            margin:-59px 0 0 -59px;
            border-radius:50%;
            border:1px solid rgba(212,175,55,.36);
            box-shadow:0 0 35px rgba(212,175,55,.12), inset 0 0 24px rgba(212,175,55,.08);
            animation:ritual-shuffle-ring 1.02s ease both;
            pointer-events:none;
            z-index:600;
          }
          @keyframes ritual-fan-shuffle {
            0%   { transform:translateX(var(--fan-x,0px)) translateY(var(--fan-y,0px)) rotate(var(--fan-angle,0deg)); }
            24%  { transform:translateX(0) translateY(20px) rotate(0deg) scale(.96); }
            43%  { transform:translateX(var(--shuffle-shift,30px)) translateY(6px) rotate(7deg) scale(.98); }
            61%  { transform:translateX(calc(var(--shuffle-shift,30px) * -1)) translateY(18px) rotate(-7deg) scale(.98); }
            78%  { transform:translateX(0) translateY(10px) rotate(0deg) scale(.97); }
            100% { transform:translateX(var(--fan-x,0px)) translateY(var(--fan-y,0px)) rotate(var(--fan-angle,0deg)); }
          }
          @keyframes ritual-shuffle-ring {
            0% { opacity:0; transform:scale(.65) rotate(0deg); }
            35% { opacity:1; transform:scale(1) rotate(80deg); }
            76% { opacity:.75; transform:scale(1.18) rotate(210deg); }
            100% { opacity:0; transform:scale(1.3) rotate(300deg); }
          }

          /* Mobile: retain a shallow fan gesture but turn the deck into a horizontally scrollable ribbon. */
          @media (max-width: 620px) {
            .manual-card-pool {
              display:flex;
              align-items:flex-end;
              gap:0;
              height:178px;
              max-height:178px;
              overflow-x:auto;
              overflow-y:hidden;
              padding:26px 26px 18px;
              scroll-snap-type:x proximity;
              overscroll-behavior-x:contain;
              -webkit-overflow-scrolling:touch;
              touch-action:pan-x;
            }
            .manual-card-pool::before { inset:auto 8px 9px; height:34%; }
            .manual-card-back {
              position:relative;
              left:auto;
              bottom:auto;
              flex:0 0 52px;
              width:52px;
              height:87px;
              margin-left:-27px;
              transform:rotate(var(--fan-mobile-angle,0deg));
              transform-origin:50% 140%;
              scroll-snap-align:center;
            }
            .manual-card-back:first-child { margin-left:0; }
            .manual-card-back:hover, .manual-card-back:focus-visible {
              transform:translateY(-14px) rotate(var(--fan-mobile-angle,0deg)) scale(1.08);
            }
            .manual-card-back.selected {
              transform:translateY(-24px) rotate(var(--fan-mobile-angle,0deg)) scale(1.1);
            }
            .manual-card-pool.is-shuffling .manual-card-back {
              animation:ritual-mobile-shuffle 1.02s cubic-bezier(.22,.72,.18,1) both;
              animation-delay:var(--shuffle-delay,0ms);
            }
            @keyframes ritual-mobile-shuffle {
              0% { transform:rotate(var(--fan-mobile-angle,0deg)); }
              28% { transform:translateY(22px) rotate(0deg) scale(.94); }
              52% { transform:translateX(var(--shuffle-shift,26px)) translateY(10px) rotate(6deg); }
              72% { transform:translateX(0) translateY(18px) rotate(-4deg); }
              100% { transform:rotate(var(--fan-mobile-angle,0deg)); }
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .manual-card-pool.is-shuffling .manual-card-back { animation:ritual-reduced-shuffle .22s ease both; animation-delay:0ms; }
            .manual-card-pool.is-shuffling::after { animation:none; opacity:.35; }
            .manual-card-back { transition:none; }
            @keyframes ritual-reduced-shuffle {
              from { opacity:.55; }
              to { opacity:1; }
            }
          }
          '''
          style_path.write_text(prefix + manual_css, encoding='utf-8')

          test_path = Path('website/tests/manual_draw_browser.mjs')
          test = test_path.read_text(encoding='utf-8')
          old = """  await page.locator('#btn-manual-shuffle').click();
            await page.waitForSelector('#manual-card-pool .manual-card-back');
            assert.equal(await page.locator('#manual-card-pool .manual-card-back').count(),78);
            assert.match(await page.locator('#manual-draw-status').innerText(), /0\\s*\\/\\s*3/);

            const backs = page.locator('#manual-card-pool .manual-card-back');"""
          new = """  await page.locator('#btn-manual-shuffle').click();
            await page.waitForSelector('#manual-card-pool .manual-card-back');
            assert.equal(await page.locator('#manual-card-pool .manual-card-back').count(),78);
            assert.equal(await page.evaluate(() => window.manualDrawState.phase),'shuffling');
            assert.equal(await page.evaluate(() => window.manualDrawState.shuffled),false);
            assert.ok(await page.locator('#manual-card-pool').evaluate(el => el.classList.contains('is-shuffling')));
            assert.equal(await page.locator('#btn-manual-shuffle').isDisabled(),true);
            await page.evaluate(() => document.querySelector('#manual-card-pool .manual-card-back:nth-child(3)').click());
            assert.deepEqual(await page.evaluate(() => window.manualDrawState.selected),[]);
            await page.waitForFunction(() => window.manualDrawState.phase === 'ready_to_draw' && window.manualDrawState.shuffled === true);
            assert.match(await page.locator('#manual-draw-status').innerText(), /0\\s*\\/\\s*3/);

            const fanGeometry = await page.locator('#manual-card-pool .manual-card-back').nth(0).evaluate(el => ({
              position:getComputedStyle(el).position,
              transform:getComputedStyle(el).transform,
              fanX:el.style.getPropertyValue('--fan-x')
            }));
            assert.equal(fanGeometry.position,'absolute');
            assert.ok(fanGeometry.fanX.endsWith('px'));
            assert.notEqual(fanGeometry.transform,'none');
            console.log('browser_manual_shuffle_phase_and_fan=passed');

            const backs = page.locator('#manual-card-pool .manual-card-back');"""
          if old not in test:
              raise SystemExit('desktop browser test target not found')
          test = test.replace(old, new, 1)

          old_mobile = """  await mobile.locator('#btn-manual-shuffle').click();
            assert.equal(await mobile.locator('#manual-card-pool .manual-card-back').count(),78);
            const mobileMetrics = await mobile.evaluate(() => {"""
          new_mobile = """  await mobile.locator('#btn-manual-shuffle').click();
            assert.equal(await mobile.locator('#manual-card-pool .manual-card-back').count(),78);
            await mobile.waitForFunction(() => window.manualDrawState.phase === 'ready_to_draw');
            const mobileLayout = await mobile.locator('#manual-card-pool .manual-card-back').nth(0).evaluate(el => ({
              position:getComputedStyle(el).position,
              width:el.getBoundingClientRect().width
            }));
            assert.equal(mobileLayout.position,'relative');
            assert.ok(mobileLayout.width >= 44);
            const mobileMetrics = await mobile.evaluate(() => {"""
          if old_mobile not in test:
              raise SystemExit('mobile browser test target not found')
          test_path.write_text(test.replace(old_mobile, new_mobile, 1), encoding='utf-8')
          PY

      - name: Build and source-check
        run: |
          cd website
          npm ci >/dev/null
          npm run build >/dev/null
          grep -q "phase: 'shuffling'" main.js
          grep -q 'ritual-fan-shuffle' style.css
          grep -q 'browser_manual_shuffle_phase_and_fan=passed' tests/manual_draw_browser.mjs

      - name: Commit generated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/style.css website/tests/manual_draw_browser.mjs website/dist
          git diff --cached --quiet && exit 0
          git commit -m 'feat(draw): animate shuffle and fan manual deck'
          git push origin HEAD:feat/manual-fan-shuffle
