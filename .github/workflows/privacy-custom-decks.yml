name: Privacy + Custom Decks

on:
  push:
    branches: [feature/privacy-custom-decks]
    paths:
      - "website/divination/**"
      - "website/public/create.html"
      - "website/public/creator.js"
      - "website/fortune_server.py"
      - "website/main.js"
      - "tests/test_privacy_custom_decks.py"
      - "tools/patch_privacy_custom_decks.py"
      - ".github/workflows/privacy-custom-decks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/privacy-custom-decks
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply integration patch
        run: python tools/patch_privacy_custom_decks.py
      - name: Validate backend and JavaScript
        run: |
          python -m unittest -v tests/test_divination_engine.py tests/test_privacy_custom_decks.py
          python -m py_compile website/fortune_server.py website/divination/*.py
          node --check website/main.js
          node --check website/public/creator.js
      - name: Clean install and build frontend
        run: |
          cd website
          rm -rf node_modules
          npm ci
          npm run build
          test -f dist/create.html
          test -f dist/creator.js
      - name: Commit generated integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/fortune_server.py website/main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(platform): integrate private sessions and custom decks"
          git push origin HEAD:feature/privacy-custom-decks
