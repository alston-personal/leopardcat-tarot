name: Apply Threads Question Language
on:
  push:
    branches: [feat/threads-question-language]
    paths:
      - '.github/workflows/apply-threads-question-language.yml'
      - 'tools/apply_threads_question_language.py'
      - 'tools/fix_threads_question_patcher.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/threads-question-language
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair patch anchor and apply source patch
        run: |
          python tools/fix_threads_question_patcher.py
          python tools/apply_threads_question_language.py
      - name: Verify contracts
        working-directory: website
        run: |
          python -m pip install pytest >/dev/null
          python -m pytest -q tests/test_threads_question_language.py
          python -m pytest -q tests
          python -m py_compile fortune_server.py divination/*.py
          node --check main.js
      - name: Validate frontend build
        working-directory: website
        run: |
          npm ci
          find public -xtype l -print > "$RUNNER_TEMP/broken-public-links.txt" || true
          while IFS= read -r link; do
            [ -n "$link" ] || continue
            rm -f "$link"
            mkdir -p "$link"
          done < "$RUNNER_TEMP/broken-public-links.txt"
          npx vite build --outDir "$RUNNER_TEMP/threads-question-dist" --emptyOutDir
      - name: Commit product changes and remove scaffolding
        run: |
          git checkout -- website/public || true
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add website/main.js website/fortune_server.py website/tests/test_threads_question_language.py governance/capabilities.json
          git rm -f .github/workflows/apply-threads-question-language.yml tools/apply_threads_question_language.py tools/fix_threads_question_patcher.py
          git commit -m "feat(reading): resolve Threads questions and follow user language"
          git push origin HEAD:feat/threads-question-language
