name: ArcanaForge Contract

on:
  push:
    branches: [feature/extract-arcana-forge]
    paths:
      - 'arcana-forge/**'
      - '.github/workflows/arcana-forge-contract.yml'
  pull_request:
    paths:
      - 'arcana-forge/**'
      - '.github/workflows/arcana-forge-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ./arcana-forge pytest
      - name: Test
        run: python -m pytest -q arcana-forge/tests
      - name: CLI semantic smoke - Tarot
        run: arcana-forge tarot-rws 'Taiwan leopard cat' 'sacred mountain watercolor' --divination-os-id leopardcat-tarot > /tmp/tarot.json
      - name: CLI semantic smoke - I Ching
        run: arcana-forge iching-zhouyi 'Taiwan leopard cat' 'sacred Chinese ink' --divination-os-id leopardcat-iching > /tmp/iching.json
      - name: End-to-end SVG build - Tarot deck.json
        run: arcana-forge tarot-rws 'Taiwan leopard cat' 'sacred mountain watercolor' --title 'LeopardCat Tarot' --provider svg --generate-dir /tmp/tarot-cards --format tarot-deck --id leopardcat-generated --default-persona leopardcat --output /tmp/deck.json
      - name: End-to-end SVG build - I Ching asset pack
        run: arcana-forge iching-zhouyi 'Taiwan leopard cat' 'sacred Chinese ink' --provider svg --generate-dir /tmp/iching-cards --format asset-pack --id leopardcat-iching --output /tmp/iching-pack.json
      - name: Migrate real LeopardCat 78-card generator into portable Subject Pack
        run: arcana-forge-migrate-leopardcat generator/cards /tmp/leopardcat.subject-pack.json
      - name: Prove portable Subject Pack no longer depends on legacy card files
        run: |
          python - <<'PY'
          from arcana_forge import forge
          from arcana_forge.packs import load_subject_pack
          pack=load_subject_pack('/tmp/leopardcat.subject-pack.json')
          collection=forge(system='tarot-rws', subject=pack, style='portable migration proof', title='LeopardCat Tarot')
          assert len(collection.units)==78
          assert collection.subject_pack_id=='leopardcat-legacy-v1'
          fool=next(x for x in collection.units if x.unit.id=='major-00')
          ace=next(x for x in collection.units if x.unit.id=='cups-01')
          assert 'moonlit road' in fool.scene
          assert fool.meanings['reversed'].startswith('Naivety')
          assert ace.meanings['reversed'].startswith('Blocked emotions')
          assert fool.visual_metadata['ecology']['species_focus']=='Taiwan leopard cat'
          assert any('The Fool' in x for x in fool.invariants)
          print('leopardcat_subject_pack_portability=passed')
          print('leopardcat_migrated_units=78')
          PY
      - name: Validate exported collections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tarot=json.load(open('/tmp/tarot.json'))
          iching=json.load(open('/tmp/iching.json'))
          deck=json.load(open('/tmp/deck.json'))
          ipack=json.load(open('/tmp/iching-pack.json'))
          assert tarot['schema']=='divination-os.asset-pack/v0.1'
          assert iching['schema']=='divination-os.asset-pack/v0.1'
          assert len(tarot['units'])==78 and len(iching['units'])==64
          assert tarot['units'][0]['name']=='The Fool' and iching['units'][0]['name']=='乾'
          assert deck['schema_version']==1 and deck['card_count']==78
          assert deck['cards'][0]['image'].endswith('major-00.svg')
          assert len(list(Path('/tmp/tarot-cards').glob('*.svg')))==78
          assert len(list(Path('/tmp/iching-cards').glob('*.svg')))==64
          assert all(unit.get('asset','').endswith('.svg') for unit in ipack['units'])
          assert ipack['units'][0]['metadata']['line_pattern_bottom_to_top']=='111111'
          print('arcana_forge_contract=passed')
          print('tarot_visual_assets=78')
          print('iching_visual_assets=64')
          PY
