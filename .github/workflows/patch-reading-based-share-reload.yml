name: Patch reading-based share reload

on:
  push:
    branches: [fix/reading-based-share-reload]
    paths:
      - '.github/workflows/patch-reading-based-share-reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-based-share-reload
          fetch-depth: 0
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply patch
        run: |
          python tools/patch_reading_based_share_reload.py
          python tools/refine_reading_based_share_reload.py
      - name: Focused tests
        working-directory: website
        run: |
          python -m pytest -q tests/test_reading_based_share_reload.py tests/test_deck_driven_share_spreads.py tests/test_ai_gateway_fail_closed.py
          python -m py_compile fortune_server.py divination/*.py
      - name: Capability guard
        run: python scripts/check_capability_regressions.py
      - name: Commit product patch and remove temporary tooling
        run: |
          rm -f tools/patch_reading_based_share_reload.py tools/refine_reading_based_share_reload.py .github/workflows/patch-reading-based-share-reload.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(share): persist reading receipt across reload'
          git push origin HEAD:fix/reading-based-share-reload
