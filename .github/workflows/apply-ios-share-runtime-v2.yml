name: Apply iOS Share Runtime v2

on:
  push:
    branches:
      - fix/ios-share-runtime-v2

permissions:
  contents: write

concurrency:
  group: apply-ios-share-runtime-v2
  cancel-in-progress: true

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-share-runtime-v2
          fetch-depth: 1
          sparse-checkout: |
            website
            docs
            .ci
            .github
      - name: Apply semantic repair
        run: python .ci/patch_ios_share_runtime_v2.py
      - name: Run focused regression tests
        run: |
          python -m pip install -q pytest
          pytest -q \
            website/tests/test_ios_share_runtime_v2.py \
            website/tests/test_share_reading_state_monotonic.py \
            website/tests/test_share_render_timeout.py
      - name: Remove temporary patch machinery
        run: |
          rm -f .ci/patch_ios_share_runtime_v2.py
          rm -f .github/workflows/apply-ios-share-runtime-v2.yml
      - name: Commit repaired product state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(share): harden iOS runtime and restore monotonicity"
          git push origin HEAD:fix/ios-share-runtime-v2
