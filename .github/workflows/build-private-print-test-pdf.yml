name: Build Private Print Test PDF

on:
  push:
    branches: [feature/private-duplex-print-v2]
    paths:
      - '.github/workflows/build-private-print-test-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-duplex-print-v2
          sparse-checkout: |
            art/renders/card-00-the-fool.png
            art/renders/card-01-the-magician.png
            art/renders/card-02-the-high-priestess.png
            art/renders/card-03-the-empress.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: pip install reportlab Pillow

      - name: Build 4-card duplex A4 test PDF
        shell: bash
        run: |
          cat > /tmp/build_print_test.py <<'PY'
          from pathlib import Path
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.units import mm
          from reportlab.lib.utils import ImageReader

          OUT = Path('leopardcat-duplex-test-4cards.pdf')
          CARDS = [
              Path('art/renders/card-00-the-fool.png'),
              Path('art/renders/card-01-the-magician.png'),
              Path('art/renders/card-02-the-high-priestess.png'),
              Path('art/renders/card-03-the-empress.png'),
          ]
          PAGE_W, PAGE_H = A4
          CARD_W, CARD_H = 70*mm, 120*mm
          GAP = 4*mm
          grid_w = 2*CARD_W + GAP
          grid_h = 2*CARD_H + GAP
          x0 = (PAGE_W-grid_w)/2
          y0 = (PAGE_H-grid_h)/2
          slots = [
              (x0, y0+CARD_H+GAP),
              (x0+CARD_W+GAP, y0+CARD_H+GAP),
              (x0, y0),
              (x0+CARD_W+GAP, y0),
          ]

          def crop_to_ratio(path, target_ratio=70/120):
              im = Image.open(path).convert('RGB')
              w,h = im.size
              r=w/h
              if r > target_ratio:
                  nw=int(h*target_ratio); left=(w-nw)//2
                  im=im.crop((left,0,left+nw,h))
              elif r < target_ratio:
                  nh=int(w/target_ratio); top=(h-nh)//2
                  im=im.crop((0,top,w,top+nh))
              return im

          def crop_marks(c, x, y):
              L=4*mm; o=1.5*mm
              c.setLineWidth(0.25)
              for xx in (x, x+CARD_W):
                  c.line(xx, y-o, xx, y-o-L)
                  c.line(xx, y+CARD_H+o, xx, y+CARD_H+o+L)
              for yy in (y, y+CARD_H):
                  c.line(x-o, yy, x-o-L, yy)
                  c.line(x+CARD_W+o, yy, x+CARD_W+o+L, yy)

          def draw_back(c,x,y):
              # Dark green / gold, deliberately 180-degree symmetric.
              c.setFillColorRGB(0.027,0.090,0.075)
              c.rect(x,y,CARD_W,CARD_H,stroke=0,fill=1)
              c.setStrokeColorRGB(0.85,0.77,0.55); c.setLineWidth(1.3)
              c.roundRect(x+3*mm,y+3*mm,CARD_W-6*mm,CARD_H-6*mm,3*mm,stroke=1,fill=0)
              c.setLineWidth(0.6)
              c.roundRect(x+5*mm,y+5*mm,CARD_W-10*mm,CARD_H-10*mm,2.5*mm,stroke=1,fill=0)
              cx=x+CARD_W/2; cy=y+CARD_H/2
              c.circle(cx,cy,14*mm,stroke=1,fill=0); c.circle(cx,cy,10*mm,stroke=1,fill=0)
              # 8-spoke symmetric emblem
              import math
              for a in range(0,360,45):
                  r1=6*mm; r2=12*mm; ang=math.radians(a)
                  c.line(cx+r1*math.cos(ang),cy+r1*math.sin(ang),cx+r2*math.cos(ang),cy+r2*math.sin(ang))
              c.setFillColorRGB(0.89,0.82,0.62)
              c.setFont('Helvetica-Bold',9)
              c.drawCentredString(cx,y+CARD_H-9*mm,'LEOPARDCAT TAROT')
              c.saveState(); c.translate(cx,y+9*mm); c.rotate(180); c.drawCentredString(0,0,'LEOPARDCAT TAROT'); c.restoreState()

          c=canvas.Canvas(str(OUT), pagesize=A4)
          c.setTitle('LeopardCat Tarot - 4 Card Duplex Test')
          # Page 1: fronts
          temps=[]
          for idx,(path,(x,y)) in enumerate(zip(CARDS,slots)):
              im=crop_to_ratio(path)
              tmp=Path(f'/tmp/card-{idx}.jpg'); im.save(tmp,'JPEG',quality=95,dpi=(300,300)); temps.append(tmp)
              c.drawImage(ImageReader(str(tmp)),x,y,width=CARD_W,height=CARD_H,preserveAspectRatio=False,mask='auto')
              crop_marks(c,x,y)
          c.setFont('Helvetica',6); c.drawString(6*mm,4*mm,'FRONT - print at 100% / Actual Size')
          c.showPage()
          # Page 2: common symmetric backs in identical positions
          for x,y in slots:
              draw_back(c,x,y); crop_marks(c,x,y)
          c.setFont('Helvetica',6); c.drawString(6*mm,4*mm,'BACK - duplex test; same slot geometry as front')
          c.save()
          print(OUT)
          PY
          python /tmp/build_print_test.py
          python - <<'PY'
          from pathlib import Path
          p=Path('leopardcat-duplex-test-4cards.pdf')
          assert p.is_file() and p.stat().st_size > 100000
          print('PDF bytes:', p.stat().st_size)
          PY

      - name: Upload test PDF
        uses: actions/upload-artifact@v4
        with:
          name: leopardcat-duplex-test-4cards
          path: leopardcat-duplex-test-4cards.pdf
          retention-days: 7
          if-no-files-found: error
