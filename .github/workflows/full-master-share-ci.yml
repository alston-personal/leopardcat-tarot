name: Full Master Share CI
on:
  push:
    branches: [feat/full-master-share]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-master-share
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch and focused tests
        run: |
          set -euo pipefail
          python tools/apply_full_master_share.py
          python -m pip install -q pytest
          PYTHONPATH=website python -m pytest -q website/tests/test_full_master_share.py website/tests/test_reading_og_share_preview.py website/tests/test_reading_based_share_reload.py
          node --check website/main.js
      - name: Build frontend
        working-directory: website
        run: |
          set -euo pipefail
          rm -rf public/art/renders public/cards
          mkdir -p public/art/renders public/cards
          npm ci
          npm run build
      - name: Commit product changes and remove scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/index.html website/main.js website/style.css website/public/locales_v10.json website/tests/test_full_master_share.py governance/capabilities.json
          git add -f website/dist/index.html || true
          git rm tools/apply_full_master_share.py .github/workflows/full-master-share-ci.yml
          git commit -m 'feat(share): share full Master interpretation by explicit opt-in'
          git push origin HEAD:feat/full-master-share
