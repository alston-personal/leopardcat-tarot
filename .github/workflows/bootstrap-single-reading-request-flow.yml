name: Bootstrap Single Reading Request Flow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-single-reading-request-flow.yml']
permissions:
  contents: write
jobs:
  patch-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-reading-request-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch feature source exactly
        run: |
          python tools/patch_single_reading_request_flow.py
          node --check website/main.js
          grep -q "function showModularRetry" website/main.js
          ! grep -q "Falling back to legacy fortune API" website/main.js
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ux): enforce one reading request flow'
          git push origin HEAD:fix/single-reading-request-flow
