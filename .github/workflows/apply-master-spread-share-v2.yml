name: Apply Master Spread Share v2

on:
  push:
    branches: [feat/master-spread-planner]
    paths:
      - 'tools/patch_master_spread_share_v2.py'
      - '.github/workflows/apply-master-spread-share-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/master-spread-planner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded N-card share patch
        run: python tools/patch_master_spread_share_v2.py
      - name: Validate syntax and share invariants
        run: |
          python -m py_compile website/divination/tarot.py website/fortune_server.py
          node --check website/main.js
          python - <<'PY'
          from pathlib import Path
          main = Path('website/main.js').read_text(encoding='utf-8')
          css = Path('website/style.css').read_text(encoding='utf-8')
          assert "share-many-card" in main
          assert "share-ten-card" in main
          assert "const col = index % layout.cols" in main
          assert "const row = Math.floor(index / layout.cols)" in main
          assert "spreadLabel" in main
          assert 'N-card canonical share layouts' in css
          assert 'grid-template-columns: repeat(5, 58px)' in css
          print('n_card_share_layout=PASS')
          PY
      - name: Commit generated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/style.css
          if git diff --cached --quiet; then
            echo 'No generated product changes required.'
            exit 0
          fi
          git commit -m 'fix(share): preserve readable layouts for 5-10 card spreads'
          git push origin HEAD:feat/master-spread-planner
