name: Apply Threads OAuth Publishing

on:
  push:
    branches: [feat/threads-oauth-text-attachment]
    paths:
      - 'scripts/patch_threads_oauth_publish.py'
      - '.github/workflows/apply-threads-oauth-publish.yml'
      - '.ci/threads-oauth-publish-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/threads-oauth-text-attachment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch_threads_oauth_publish.py
      - name: Install focused tests
        working-directory: website
        run: python -m pip install pytest >/dev/null
      - name: Run focused Threads tests
        working-directory: website
        run: python -m pytest -q tests/test_threads_publishing_service.py tests/test_threads_oauth_publish_contract.py tests/test_threads_author_long_share.py tests/test_threads_share_autosplit.py
      - name: Compile server
        working-directory: website
        run: python -m py_compile fortune_server.py divination/threads_publishing.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/main.js website/fortune_server.py website/tests/test_threads_oauth_publish_contract.py docs/experience/THREADS_OAUTH_TEXT_ATTACHMENT.md
          git commit -m 'feat(threads): add OAuth text-attachment publishing path'
          git push origin HEAD:feat/threads-oauth-text-attachment
      - name: Remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/patch_threads_oauth_publish.py .github/workflows/apply-threads-oauth-publish.yml || true
          rm -f .ci/threads-oauth-publish-trigger
          git add -A
          git commit -m 'chore(threads): remove temporary OAuth patch workflow'
          git push origin HEAD:feat/threads-oauth-text-attachment
