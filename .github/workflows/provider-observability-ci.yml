name: Provider Observability CI

on:
  push:
    branches:
      - feat/provider-observability
    paths:
      - 'website/divination/ai_gateway.py'
      - 'website/tests/test_provider_observability.py'
      - '.github/workflows/provider-observability-ci.yml'
  pull_request:
    paths:
      - 'website/divination/ai_gateway.py'
      - 'website/tests/test_provider_observability.py'
      - '.github/workflows/provider-observability-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run provider observability regression
        run: python -m pytest -q tests/test_provider_observability.py tests/test_ai_gateway_fail_closed.py
