name: Apply Threads Preview Buster
on:
  push:
    branches: [fix/reading-og-share-preview]
    paths:
      - 'tools/apply_threads_preview_buster.py'
      - '.github/workflows/apply-threads-preview-buster.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-og-share-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and test
        run: |
          python tools/apply_threads_preview_buster.py
          python -m pip install -q pytest
          python -m pytest -q website/tests/test_reading_og_share_preview.py
          node --check website/main.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/tests/test_reading_og_share_preview.py
          git commit -m 'fix(share): refresh Threads reading previews'
          git rm tools/apply_threads_preview_buster.py .github/workflows/apply-threads-preview-buster.yml
          git commit -m 'chore(ci): remove temporary Threads preview patcher'
          git push origin HEAD:fix/reading-og-share-preview
