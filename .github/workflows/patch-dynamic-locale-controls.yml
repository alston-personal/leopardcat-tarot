name: Patch Dynamic Locale Controls
on:
  push:
    branches: [fix/public-ui-integrity]
    paths:
      - '.github/workflows/patch-dynamic-locale-controls.yml'
      - 'tools/compile_dynamic_locale_controls.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 tools/compile_dynamic_locale_controls.py
          cd website
          python3 -m pytest -q tests
          node --check main.js
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/tests/test_public_ui_integrity.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(i18n): retranslate dynamic reader and theme controls'
          git push origin HEAD:fix/public-ui-integrity
