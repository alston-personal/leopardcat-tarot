name: Compile Provider 429 User Message

on:
  push:
    branches: [fix/provider-429-user-message]
    paths:
      - '.github/workflows/patch-provider-429-message.yml'
      - 'tools/compile_provider_429_message.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/patch-provider-429-message.yml
            tools/compile_provider_429_message.py
            website/main.js
            website/tests
      - name: Compile accurate provider-state wording
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 tools/compile_provider_429_message.py
          cd website
          python3 -m pytest -q tests/test_provider_429_user_message.py
          node --check main.js
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/tests/test_provider_429_user_message.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ai): report provider 429 state accurately'
          git push origin HEAD:fix/provider-429-user-message
