name: Compile Zero Cost Provider Pool
on:
  push:
    branches: [feat/zero-cost-provider-pool]
    paths:
      - '.github/workflows/patch-zero-cost-provider-pool.yml'
      - 'tools/compile_zero_cost_provider_pool.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 tools/compile_zero_cost_provider_pool.py
          cd website
          python3 -m pytest -q tests/test_ai_gateway_fail_closed.py tests/test_provider_pool_quality.py tests/test_provider_pool_runtime.py
          python3 -m py_compile fortune_server.py divination/ai_gateway.py
          cd ..
          python3 scripts/check_capability_regressions.py
          python3 scripts/check_capability_ledger_monotonic.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/divination/ai_gateway.py website/fortune_server.py website/tests/test_provider_pool_quality.py website/tests/test_provider_pool_runtime.py governance/capabilities.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ai): add provider-neutral zero-cost fallback pool'
          git push origin HEAD:feat/zero-cost-provider-pool
