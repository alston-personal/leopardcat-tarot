name: Apply Deck Share Theme
on:
  push:
    branches: [fix/deck-share-theme]
    paths: ['.github/workflows/apply-deck-share-theme.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deck-share-theme
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deck-owned share theme contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          main = Path('website/main.js')
          s = main.read_text(encoding='utf-8')
          anchor = """function renderShareCards(frame, shareContext) {
    const entries = shareContext.cards;
"""
          if anchor not in s:
              raise SystemExit('renderShareCards anchor missing')

          insert_after = """function renderShareCards(frame, shareContext) {
    const entries = shareContext.cards;
    frame.classList.toggle('share-three-card', entries.length > 1);
    frame.innerHTML = '';
    entries.forEach((entry, index) => {
        const slot = document.createElement('div');
        slot.className = 'share-card-slot';
        const img = document.createElement('img');
        if (index === 0) img.id = 'share-card-img'; // compatibility for older selectors/tests
        img.className = 'share-card-image';
        img.src = getShareCardImage(entry.card, shareContext.deckId);
        img.alt = getShareCardTitle(entry.card);
        img.style.transform = entry.orientation === 'reversed' ? 'rotate(180deg)' : '';
        slot.appendChild(img);
        const caption = document.createElement('div');
        caption.className = 'share-card-caption';
        const position = entry.position_label || entry.position;
        const orientation = entry.orientation === 'reversed' ? uiText('orientation_reversed', 'Reversed') : uiText('orientation_upright', 'Upright');
        caption.textContent = `${position ? position + ' · ' : ''}${getShareCardTitle(entry.card)} · ${orientation}`;
        slot.appendChild(caption);
        frame.appendChild(slot);
    });
}
"""
          if insert_after not in s:
              raise SystemExit('full renderShareCards block missing')
          addition = r'''

function readThemeToken(name, fallback) {
    try {
        const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return value || fallback;
    } catch (_) {
        return fallback;
    }
}

function normalizeShareTheme(shareContext) {
    const deck = shareContext?.deck || {};
    const deckId = shareContext?.deckId || deck.deck_id || window.activeDeckId || 'leopardcat';
    const explicit = (deck.share_theme && typeof deck.share_theme === 'object') ? deck.share_theme : {};
    const hasExplicit = Object.keys(explicit).length > 0;
    const hasDeckTheme = Boolean(deck.default_theme || deck.theme_id || window.currentReadingState?.theme_id || window.activeThemeId);
    const isLeopardCat = deckId === 'leopardcat';
    const neutral = {
        background: '#171717',
        surface: 'rgba(255,255,255,.055)',
        accent: '#d7d2c8',
        text: '#f5f2ec',
        muted: 'rgba(245,242,236,.74)',
        line: 'rgba(215,210,200,.28)'
    };
    const themed = {
        background: readThemeToken('--color-bg', '#0a110e'),
        surface: readThemeToken('--color-card-bg', 'rgba(212,175,55,.05)'),
        accent: readThemeToken('--color-gold', '#d4af37'),
        text: readThemeToken('--color-text', '#ffffff'),
        muted: readThemeToken('--color-text-muted', 'rgba(244,241,234,.82)'),
        line: readThemeToken('--color-gold-glow', 'rgba(212,175,55,.28)')
    };
    const base = (isLeopardCat || hasDeckTheme) ? themed : neutral;
    const title = String(explicit.title || deck.name || (isLeopardCat ? window.brandText('share_title', '靈山靈貓 · 石虎塔羅') : 'Tarot Reading'));
    const siteTag = String(explicit.site_tag || (isLeopardCat ? window.brandText('share_site_tag', location.host) : location.host));
    return {
        source: hasExplicit ? 'deck' : ((isLeopardCat || hasDeckTheme) ? 'theme-derived' : 'neutral'),
        layout: String(explicit.layout || (isLeopardCat ? 'spirit-memo' : 'deck-memo')),
        title,
        site_tag: siteTag,
        background: String(explicit.background || base.background),
        surface: String(explicit.surface || base.surface),
        accent: String(explicit.accent || base.accent),
        text: String(explicit.text || base.text),
        muted: String(explicit.muted || base.muted),
        line: String(explicit.line || base.line)
    };
}

function applyShareTheme(template, shareContext) {
    const theme = normalizeShareTheme(shareContext);
    template.dataset.shareThemeSource = theme.source;
    template.dataset.shareLayout = theme.layout;
    template.style.setProperty('--share-bg', theme.background);
    template.style.setProperty('--share-surface', theme.surface);
    template.style.setProperty('--share-accent', theme.accent);
    template.style.setProperty('--share-text', theme.text);
    template.style.setProperty('--share-muted', theme.muted);
    template.style.setProperty('--share-line', theme.line);
    const memo = template.querySelector('#share-memo-title');
    const site = template.querySelector('#share-site-tag');
    if (memo) memo.textContent = theme.title;
    if (site) site.textContent = theme.site_tag;
    return theme;
}
'''
          s = s.replace(insert_after, insert_after + addition, 1)

          old = """    const shareFrame = template.querySelector('.share-card-frame');
    renderShareCards(shareFrame, shareContext);
    const titleParts = shareEntries.map(entry => getShareCardTitle(entry.card));
"""
          new = """    const shareFrame = template.querySelector('.share-card-frame');
    renderShareCards(shareFrame, shareContext);
    const shareTheme = applyShareTheme(template, shareContext);
    const titleParts = shareEntries.map(entry => getShareCardTitle(entry.card));
"""
          if old not in s: raise SystemExit('share frame anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("backgroundColor: '#0a0f0d',", "backgroundColor: shareTheme.background,", 1)
          old_labels = """        document.getElementById('share-memo-title').innerText = window.brandText('share_title', uiCommon.share_memo_title);
        document.getElementById('share-seeker-label').innerText = uiCommon.share_seeker_label;
        document.getElementById('share-site-tag').innerText = window.brandText('share_site_tag', uiCommon.share_site_tag);
"""
          new_labels = """        applyShareTheme(template, shareContext); // deck/theme owns share branding; locale refresh must not restore LeopardCat defaults.
        document.getElementById('share-seeker-label').innerText = uiCommon.share_seeker_label;
"""
          if old_labels not in s: raise SystemExit('late share label anchor missing')
          s = s.replace(old_labels, new_labels, 1)
          main.write_text(s, encoding='utf-8')

          decks = Path('website/divination/decks.py')
          d = decks.read_text(encoding='utf-8')
          d = d.replace('    card_back: str = "/art/card-back.svg"\n', '    card_back: str = "/art/card-back.svg"\n    share_theme: dict[str, Any] | None = None\n', 1)
          builtin_old = """                \"leopardcat\",
                \"/art/card-back.svg\",
            )
"""
          builtin_new = """                \"leopardcat\",
                \"/art/card-back.svg\",
                {
                    \"layout\": \"spirit-memo\",
                    \"title\": \"靈山靈貓 · 石虎塔羅\",
                    \"site_tag\": \"leopardcat-tarot.milkcat.org\",
                    \"background\": \"#0a110e\",
                    \"accent\": \"#d4af37\",
                },
            )
"""
          if builtin_old not in d: raise SystemExit('builtin deck constructor anchor missing')
          d = d.replace(builtin_old, builtin_new, 1)
          custom_old = """            card_back=str(data.get(\"card_back\") or \"/art/card-back.svg\"),
        )
"""
          custom_new = """            card_back=str(data.get(\"card_back\") or \"/art/card-back.svg\"),
            share_theme=data.get(\"share_theme\") if isinstance(data.get(\"share_theme\"), dict) else None,
        )
"""
          if custom_old not in d: raise SystemExit('custom deck constructor anchor missing')
          d = d.replace(custom_old, custom_new, 1)
          public_old = '            "card_back": d.card_back,\n'
          public_new = '            "card_back": d.card_back,\n            "share_theme": d.share_theme or {},\n'
          if public_old not in d: raise SystemExit('public deck info anchor missing')
          d = d.replace(public_old, public_new, 1)
          decks.write_text(d, encoding='utf-8')

          pub = Path('website/divination/publishing.py')
          p = pub.read_text(encoding='utf-8')
          helper_anchor = """def _clean_text(value: Any, max_len: int) -> str:
    text = str(value or \"\").replace(\"\\x00\", \" \")
    text = re.sub(r\"[<>]\", \"\", text)
    text = re.sub(r\"[\\t\\r]+\", \" \", text)
    return text.strip()[:max_len]
"""
          helper_add = helper_anchor + r'''

_SHARE_THEME_FIELDS = {
    "layout": 32,
    "title": 120,
    "site_tag": 120,
    "background": 80,
    "surface": 80,
    "accent": 80,
    "text": 80,
    "muted": 80,
    "line": 80,
}


def _clean_share_theme(value: Any) -> dict[str, str]:
    if not isinstance(value, dict):
        return {}
    cleaned: dict[str, str] = {}
    for key, max_len in _SHARE_THEME_FIELDS.items():
        if key in value:
            item = _clean_text(value.get(key), max_len)
            if item:
                cleaned[key] = item
    return cleaned
'''
          if helper_anchor not in p: raise SystemExit('publishing helper anchor missing')
          p = p.replace(helper_anchor, helper_add, 1)
          p = p.replace('        default_theme = _clean_text(payload.get("theme"), 64).lower() or "minimal-light"\n', '        default_theme = _clean_text(payload.get("theme"), 64).lower() or "minimal-light"\n        share_theme = _clean_share_theme(payload.get("share_theme"))\n', 1)
          manifest_old = '                "default_theme": default_theme,\n                "card_count": len(saved_cards),\n'
          manifest_new = '                "default_theme": default_theme,\n                "share_theme": share_theme,\n                "card_count": len(saved_cards),\n'
          if manifest_old not in p: raise SystemExit('manifest anchor missing')
          p = p.replace(manifest_old, manifest_new, 1)
          p = p.replace('            "default_theme": default_theme,\n            "share_path":', '            "default_theme": default_theme,\n            "share_theme": share_theme,\n            "share_path":', 1)
          p = p.replace('            "default_theme": data.get("default_theme", "minimal-light"),\n            "reversals":', '            "default_theme": data.get("default_theme", "minimal-light"),\n            "share_theme": data.get("share_theme") if isinstance(data.get("share_theme"), dict) else {},\n            "reversals":', 1)
          update_anchor = """        if \"theme\" in payload:
            theme = _clean_text(payload.get(\"theme\"), 64).lower()
            if not re.fullmatch(r\"[a-z0-9][a-z0-9-]{1,63}\", theme):
                raise DivinationError(\"無效的牌組主題\")
            data[\"default_theme\"] = theme
"""
          update_new = update_anchor + """        if \"share_theme\" in payload:
            data[\"share_theme\"] = _clean_share_theme(payload.get(\"share_theme\"))
"""
          if update_anchor not in p: raise SystemExit('update metadata anchor missing')
          p = p.replace(update_anchor, update_new, 1)
          pub.write_text(p, encoding='utf-8')

          css = Path('website/style.css')
          c = css.read_text(encoding='utf-8')
          css_add = r'''

/* Share surface is owned by the active Deck/Theme contract, not LeopardCat globals. */
.share-card-body {
  --share-bg: #171717;
  --share-surface: rgba(255,255,255,.055);
  --share-accent: #d7d2c8;
  --share-text: #f5f2ec;
  --share-muted: rgba(245,242,236,.74);
  --share-line: rgba(215,210,200,.28);
  background: var(--share-bg);
  border-color: var(--share-accent);
  color: var(--share-text);
}
.share-card-body .share-header,
.share-card-body .share-footer { border-color: var(--share-line); }
.share-card-body .share-logo,
.share-card-body .share-info h2,
.share-card-body .quote-mark,
.share-card-body .share-seeker .label { color: var(--share-accent); }
.share-card-body .share-card-frame {
  background: var(--share-surface);
  border-color: var(--share-line);
}
.share-card-body .share-card-caption { color: var(--share-muted); }
.share-card-body[data-share-layout="deck-memo"] .share-logo { letter-spacing: .04em; }
'''
          if 'Share surface is owned by the active Deck/Theme contract' not in c:
              c += css_add
          css.write_text(c, encoding='utf-8')

          cap = Path('governance/capabilities.json')
          g = cap.read_text(encoding='utf-8')
          cap_anchor = '    "sharing.reading-receipt-reload": {'
          block = '''    "sharing.deck-owned-share-theme": {\n      "status": "protected",\n      "owner": "website",\n      "contract": [\n        "Share-card branding, palette, and layout are resolved from the active Deck Module/share_theme or its active Theme instead of a global LeopardCat template.",\n        "Custom decks without an explicit share_theme derive the share surface from their active theme; decks without either use a neutral platform fallback, never LeopardCat branding.",\n        "Deck public metadata may expose a sanitized share_theme contract without executable HTML/CSS or arbitrary fields.",\n        "Deck-driven card faces, spread order, positions, and upright/reversed orientation remain unchanged."\n      ],\n      "evidence": [\n        "website/main.js",\n        "website/style.css",\n        "website/divination/decks.py",\n        "website/divination/publishing.py",\n        "website/tests/test_deck_owned_share_theme.py"\n      ]\n    },\n'''
          if '"sharing.deck-owned-share-theme"' not in g:
              if cap_anchor not in g: raise SystemExit('capability anchor missing')
              g = g.replace(cap_anchor, block + cap_anchor, 1)
          cap.write_text(g, encoding='utf-8')

          test = Path('website/tests/test_deck_owned_share_theme.py')
          test.write_text(r'''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]


def test_share_theme_is_deck_owned_and_has_neutral_fallback():
    main = (ROOT / "main.js").read_text(encoding="utf-8")
    assert "function normalizeShareTheme(shareContext)" in main
    assert "deck.share_theme" in main
    assert "source: hasExplicit ? 'deck'" in main
    assert "'theme-derived' : 'neutral'" in main
    assert "applyShareTheme(template, shareContext)" in main
    assert "backgroundColor: shareTheme.background" in main
    late = "window.brandText('share_title', uiCommon.share_memo_title)"
    assert late not in main


def test_share_theme_is_public_sanitized_deck_metadata():
    decks = (ROOT / "divination" / "decks.py").read_text(encoding="utf-8")
    publishing = (ROOT / "divination" / "publishing.py").read_text(encoding="utf-8")
    assert "share_theme: dict[str, Any] | None = None" in decks
    assert '"share_theme": d.share_theme or {}' in decks
    assert "_SHARE_THEME_FIELDS" in publishing
    assert "_clean_share_theme" in publishing
    assert '"share_theme": share_theme' in publishing


def test_share_css_uses_runtime_share_tokens():
    css = (ROOT / "style.css").read_text(encoding="utf-8")
    assert "--share-bg" in css
    assert "background: var(--share-bg)" in css
    assert "border-color: var(--share-accent)" in css
    assert ".share-card-body .share-card-frame" in css


def test_capability_is_protected():
    governance = (ROOT.parent / "governance" / "capabilities.json").read_text(encoding="utf-8")
    assert '"sharing.deck-owned-share-theme"' in governance
    assert '"status": "protected"' in governance
''', encoding='utf-8')
          PY
      - name: Validate source and tests
        shell: bash
        run: |
          python -m py_compile website/divination/decks.py website/divination/publishing.py
          python -m pytest -q website/tests/test_deck_owned_share_theme.py website/tests/test_deck_driven_share_spreads.py
          node --check website/main.js
          cd website
          rm -f public/art/renders public/cards || true
          mkdir -p public/art/renders public/cards
          npm ci >/dev/null
          npm run build >/dev/null
      - name: Commit implementation only
        shell: bash
        run: |
          git checkout HEAD -- website/dist/art website/dist/cards 2>/dev/null || true
          git add website/main.js website/style.css website/divination/decks.py website/divination/publishing.py website/tests/test_deck_owned_share_theme.py governance/capabilities.json
          git add -u website/dist/index.html || true
          git rm .github/workflows/apply-deck-share-theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(share): make share card theme deck-owned'
          git push origin HEAD:fix/deck-share-theme
