name: Apply Share Regression Fix
on:
  push:
    paths:
      - '.github/workflows/apply-share-regression-fix.yml'
      - 'tools/apply_share_regression_fix.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-sanitize-card-link
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_share_regression_fix.py
      - name: Verify source
        run: |
          grep -F "holder.querySelectorAll('.hidden-quote" website/main.js
          grep -F "applySingleCardShareFallback(shareU);" website/main.js
          grep -F "shareU.searchParams.set('card', cardId);" website/main.js
      - name: Validate frontend build
        id: build
        continue-on-error: true
        working-directory: website
        run: |
          set -o pipefail
          {
            node --version
            npm --version
            npm ci
            # public/art/renders is an Oracle-local symlink. Hosted CI validates
            # the JS bundle with an empty stand-in; production builds with the
            # real render target on Oracle.
            if [ -L public/art/renders ]; then
              mv public/art/renders "$RUNNER_TEMP/renders-link"
              mkdir -p public/art/renders
            fi
            npx vite build --outDir "$RUNNER_TEMP/share-dist" --emptyOutDir
            rm -rf public/art/renders
            if [ -L "$RUNNER_TEMP/renders-link" ]; then mv "$RUNNER_TEMP/renders-link" public/art/renders; fi
          } 2>&1 | tee "$RUNNER_TEMP/share-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-build-log
          path: ${{ runner.temp }}/share-build.log
          retention-days: 1
      - name: Enforce build success
        if: steps.build.outcome != 'success'
        run: exit 1
      - name: Commit source fix
        run: |
          git checkout -- website/public/art/renders || true
          if git diff --quiet -- website/main.js; then exit 0; fi
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add website/main.js
          git commit -m "fix(share): sanitize hidden markup and preserve single card link"
          git push origin HEAD:fix/share-sanitize-card-link
