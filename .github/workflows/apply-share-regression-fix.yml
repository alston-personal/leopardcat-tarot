name: Apply Share Regression Fix
on:
  push:
    paths:
      - '.github/workflows/apply-share-regression-fix.yml'
      - 'tools/apply_share_regression_fix.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-sanitize-card-link
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_share_regression_fix.py
      - name: Verify source
        run: |
          grep -F "holder.querySelectorAll('.hidden-quote" website/main.js
          grep -F "applySingleCardShareFallback(shareU);" website/main.js
          grep -F "shareU.searchParams.set('card', cardId);" website/main.js
      - name: Validate frontend build
        id: build
        continue-on-error: true
        working-directory: website
        run: |
          set -o pipefail
          {
            node --version
            npm --version
            npm ci
            # Several public assets are Oracle-local symlinks. Hosted CI only
            # validates the JS bundle, so replace broken symlinks with empty
            # stand-in directories. Production still builds on Oracle with the
            # real targets present.
            find public -xtype l -print > "$RUNNER_TEMP/broken-public-links.txt" || true
            while IFS= read -r link; do
              [ -n "$link" ] || continue
              rm -f "$link"
              mkdir -p "$link"
            done < "$RUNNER_TEMP/broken-public-links.txt"
            npx vite build --outDir "$RUNNER_TEMP/share-dist" --emptyOutDir
          } 2>&1 | tee "$RUNNER_TEMP/share-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-build-log
          path: ${{ runner.temp }}/share-build.log
          retention-days: 1
      - name: Enforce build success
        if: steps.build.outcome != 'success'
        run: exit 1
      - name: Commit source fix
        run: |
          git checkout -- website/public || true
          if git diff --quiet -- website/main.js; then exit 0; fi
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add website/main.js
          git commit -m "fix(share): sanitize hidden markup and preserve single card link"
          git push origin HEAD:fix/share-sanitize-card-link
