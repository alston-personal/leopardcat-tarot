name: Apply Share Regression Fix
on:
  push:
    paths:
      - '.github/workflows/apply-share-regression-fix.yml'
      - 'website/main.js'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/share-sanitize-card-link
          fetch-depth: 0
      - name: Patch share sanitizer and single-card fallback link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('website/main.js')
          s = p.read_text(encoding='utf-8')

          old = re.search(r"function normalizeMasterShareText\(value\) \{.*?\n\}\n\nfunction latestMasterInterpretation", s, re.S)
          if not old:
              raise SystemExit('normalizeMasterShareText block not found')
          replacement = r'''function normalizeMasterShareText(value) {
    const raw = String(value || '');
    const holder = document.createElement('div');
    holder.innerHTML = raw;
    holder.querySelectorAll('.hidden-quote, [hidden], [aria-hidden="true"]').forEach(node => node.remove());
    holder.querySelectorAll('[style]').forEach(node => {
        const style = String(node.getAttribute('style') || '').replace(/\s+/g, '').toLowerCase();
        if (style.includes('display:none') || style.includes('visibility:hidden')) node.remove();
    });
    const plain = holder.textContent || holder.innerText || raw;
    return plain
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/__(.*?)__/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}

function applySingleCardShareFallback(shareU) {
    const state = window.currentReadingState;
    const cards = Array.isArray(state?.cards) ? state.cards : [];
    const first = cards[0] || null;
    const spread = state?.spread || window.currentReadingEnvelope?.method_result?.spread || 'single';
    if (spread !== 'single') return;
    const cardId = first?.card_id || state?.card_id || window.currentDrawnCard?.id || null;
    const orientation = first?.orientation || state?.orientation || 'upright';
    if (cardId) shareU.searchParams.set('card', cardId);
    if (orientation) shareU.searchParams.set('orientation', orientation);
}

function latestMasterInterpretation'''
          s = s[:old.start()] + replacement + s[old.end():]

          marker = """        if (envelope?.reading_id && envelope?.share_token) {
            shareU.searchParams.set('reading', envelope.reading_id);
            shareU.searchParams.set('share', envelope.share_token);
        }
"""
          count = s.count(marker)
          if count < 2:
              raise SystemExit(f'expected at least 2 share receipt blocks, got {count}')
          s = s.replace(marker, marker + "        applySingleCardShareFallback(shareU);\n")

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify source markers
        shell: bash
        run: |
          grep -F "holder.querySelectorAll('.hidden-quote" website/main.js
          grep -F "applySingleCardShareFallback(shareU);" website/main.js
          grep -F "shareU.searchParams.set('card', cardId);" website/main.js
      - name: Build frontend
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Commit generated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/dist
          git commit -m 'fix(share): sanitize hidden markup and preserve single card link'
          git push origin HEAD:fix/share-sanitize-card-link
