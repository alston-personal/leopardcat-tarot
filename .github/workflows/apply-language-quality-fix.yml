name: Apply Language-aware Master Quality Fix
on:
  workflow_dispatch:
  push:
    branches: [fix/language-aware-master-quality]
    paths:
      - 'tools/apply_language_quality_fix.py'
      - '.github/workflows/apply-language-quality-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/language-aware-master-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply patch
        run: python tools/apply_language_quality_fix.py
      - name: Run focused regression
        run: |
          cd website
          python -m pytest -q tests/test_language_aware_master_quality.py tests/test_ai_gateway.py || python -m pytest -q tests/test_language_aware_master_quality.py
      - name: Compile
        run: python -m py_compile website/divination/ai_gateway.py
      - name: Commit product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/divination/ai_gateway.py website/tests/test_language_aware_master_quality.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(master): make quality floor language-aware'
          git push origin HEAD:fix/language-aware-master-quality
