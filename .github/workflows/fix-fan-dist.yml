name: Restore Fan Dist Assets

on:
  push:
    branches: [feat/manual-fan-shuffle]
    paths:
      - '.github/workflows/fix-fan-dist.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-fan-shuffle
          fetch-depth: 0
      - name: Restore unrelated generated assets
        run: |
          git fetch origin main
          git checkout origin/main -- website/dist/art website/dist/cards
          git rm .github/workflows/fix-fan-dist.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'fix(draw): preserve existing dist card assets'
          git push origin HEAD:feat/manual-fan-shuffle
