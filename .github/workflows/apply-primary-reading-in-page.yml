name: Apply Primary Reading In Page
on:
  push:
    branches: [fix/in-site-primary-reading]
    paths:
      - 'tools/patch_primary_reading_in_page.py'
      - '.github/workflows/apply-primary-reading-in-page.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/in-site-primary-reading
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact source patch
        run: |
          python tools/patch_primary_reading_in_page.py
          node --check website/main.js
          grep -q "el.setAttribute('href', '#fortune')" website/main.js
      - name: Commit generated source only
        run: |
          if git diff --quiet -- website/main.js; then
            echo 'source already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js
          git commit -m 'fix(ux): keep primary tarot reading on deck page'
          git push origin HEAD:fix/in-site-primary-reading
