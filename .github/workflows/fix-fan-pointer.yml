name: Fix Fan Pointer Selection

on:
  push:
    branches: [feat/manual-fan-shuffle]
    paths:
      - '.github/workflows/fix-fan-pointer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-fan-shuffle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch continuous desktop fan hit surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('website/main.js')
          s = p.read_text(encoding='utf-8')
          anchor = """function renderManualCardPool() {
          """
          helper = """function nearestManualFanButton(pool, clientX) {
              const cards = [...pool.querySelectorAll('.manual-card-back:not(:disabled)')];
              let best = null;
              let bestDistance = Number.POSITIVE_INFINITY;
              cards.forEach(button => {
                  const rect = button.getBoundingClientRect();
                  const center = rect.left + rect.width / 2;
                  const distance = Math.abs(clientX - center);
                  if (distance < bestDistance) {
                      best = button;
                      bestDistance = distance;
                  }
              });
              return best;
          }

          function bindManualFanPointer(pool) {
              if (!pool || pool.dataset.fanPointerBound === 'true') return;
              pool.dataset.fanPointerBound = 'true';
              const isDesktopFan = () => !window.matchMedia?.('(max-width: 620px)').matches;
              const clearHover = () => pool.querySelectorAll('.manual-card-back.fan-hover').forEach(card => card.classList.remove('fan-hover'));

              pool.addEventListener('pointermove', event => {
                  if (!isDesktopFan() || window.manualDrawState.phase === 'shuffling') return;
                  const button = nearestManualFanButton(pool, event.clientX);
                  clearHover();
                  button?.classList.add('fan-hover');
              });
              pool.addEventListener('pointerleave', clearHover);
              pool.addEventListener('click', event => {
                  // Keyboard/programmatic button activation remains owned by the button listener.
                  if (event.target.closest?.('.manual-card-back') || !isDesktopFan()) return;
                  const button = nearestManualFanButton(pool, event.clientX);
                  if (!button) return;
                  const index = Number(button.dataset.drawIndex);
                  if (Number.isInteger(index)) selectManualCard(index, button);
              });
          }

          function renderManualCardPool() {
          """
          if anchor not in s:
              raise SystemExit('renderManualCardPool anchor missing')
          s = s.replace(anchor, helper, 1)

          old = """        pool.appendChild(button);
              }
              manualStatus();
          }"""
          new = """        pool.appendChild(button);
              }
              bindManualFanPointer(pool);
              manualStatus();
          }"""
          if old not in s:
              raise SystemExit('render tail missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('website/style.css')
          s = p.read_text(encoding='utf-8')
          old = """  touch-action:manipulation;
          }
          .manual-card-back img"""
          new = """  touch-action:manipulation;
            pointer-events:none;
          }
          .manual-card-back img"""
          if old not in s:
              raise SystemExit('desktop pointer css anchor missing')
          s = s.replace(old, new, 1)
          old = ".manual-card-back:hover, .manual-card-back:focus-visible {"
          new = ".manual-card-back:hover, .manual-card-back:focus-visible, .manual-card-back.fan-hover {"
          if old not in s:
              raise SystemExit('hover css anchor missing')
          s = s.replace(old, new, 1)
          old = """    scroll-snap-align:center;
              }
              .manual-card-back:first-child"""
          new = """    scroll-snap-align:center;
                pointer-events:auto;
              }
              .manual-card-back:first-child"""
          if old not in s:
              raise SystemExit('mobile pointer css anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('website/tests/manual_draw_browser.mjs')
          s = p.read_text(encoding='utf-8')
          old = """  const backs = page.locator('#manual-card-pool .manual-card-back');
            await backs.nth(2).click();
            await backs.nth(75).click();
            await backs.nth(54).click();"""
          new = """  const backs = page.locator('#manual-card-pool .manual-card-back');
            const pool = page.locator('#manual-card-pool');
            await pool.scrollIntoViewIfNeeded();
            const clickFanIndex = async zeroBasedIndex => {
              const cardBox = await backs.nth(zeroBasedIndex).boundingBox();
              const poolBox = await pool.boundingBox();
              assert.ok(cardBox && poolBox);
              const x = cardBox.x + cardBox.width / 2;
              const y = Math.min(poolBox.y + poolBox.height - 18, poolBox.y + poolBox.height * 0.72);
              await page.mouse.move(x, y);
              assert.ok(await backs.nth(zeroBasedIndex).evaluate(el => el.classList.contains('fan-hover')));
              await page.mouse.click(x, y);
            };
            await clickFanIndex(2);
            await clickFanIndex(75);
            await clickFanIndex(54);"""
          if old not in s:
              raise SystemExit('manual click test anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build check
        run: |
          cd website
          rm -f public/art/renders public/cards || true
          mkdir -p public/art/renders public/cards
          npm ci >/dev/null
          npm run build >/dev/null
          grep -q 'nearestManualFanButton' main.js
          grep -q 'fan-hover' style.css
          grep -q 'clickFanIndex' tests/manual_draw_browser.mjs
      - name: Commit fix and remove construction workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/style.css website/tests/manual_draw_browser.mjs
          git add -f website/dist/index.html
          git rm .github/workflows/fix-fan-pointer.yml
          git commit -m 'fix(draw): make fan cards reliably selectable'
          git push origin HEAD:feat/manual-fan-shuffle
