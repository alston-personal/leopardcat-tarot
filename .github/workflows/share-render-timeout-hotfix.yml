name: Share Render Timeout Hotfix

on:
  push:
    branches:
      - fix/share-render-timeout

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotfix
        run: python tools/apply_share_render_timeout_fix.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run focused test
        run: python -m pytest website/tests/test_share_render_timeout.py
      - name: Syntax check
        run: node --check website/main.js
      - name: Frontend build
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/main.js website/tests/test_share_render_timeout.py
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix(share): tolerate mobile Safari render latency'
          git push origin HEAD:fix/share-render-timeout
