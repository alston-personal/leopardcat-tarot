name: Compile Runtime I18n Parity

on:
  push:
    branches: [fix/runtime-i18n-parity]
    paths:
      - '.github/workflows/patch-runtime-i18n-parity.yml'
      - 'tools/compile_runtime_i18n_parity.py'
      - 'tools/compile_runtime_i18n_parity_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile runtime i18n parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 tools/compile_runtime_i18n_parity_v2.py
          cd website
          python3 -m pytest -q tests/test_ui_locales.py tests/test_runtime_i18n_parity.py tests/test_mobile_nav_reachability.py
          node --check main.js
          cd ..
          python3 scripts/check_capability_regressions.py
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/public/locales_v10.json website/tests/test_runtime_i18n_parity.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(i18n): localize remaining runtime controls'
          git push origin HEAD:fix/runtime-i18n-parity
