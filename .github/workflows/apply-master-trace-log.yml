name: Apply Master Provider Trace Log
on:
  workflow_dispatch:
  push:
    branches: [fix/master-provider-diagnostics]
    paths:
      - 'tools/apply_master_trace_log.py'
      - '.github/workflows/apply-master-trace-log.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/master-provider-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply patch
        run: python tools/apply_master_trace_log.py
      - name: Validate
        run: |
          cd website
          python -m pytest -q tests/test_master_provider_trace_logging.py
          python -m py_compile fortune_server.py
      - name: Commit product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/fortune_server.py website/tests/test_master_provider_trace_logging.py
          git commit -m 'chore(master): log content-free provider failure trace'
          git push origin HEAD:fix/master-provider-diagnostics
