name: Reading Singleflight Home Update CI
on:
  push:
    branches: [fix/reading-singleflight-home-update]
    paths:
      - 'tools/apply_singleflight_home_update.py'
      - '.github/workflows/reading-singleflight-home-update-ci.yml'
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reading-singleflight-home-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply product patch
        run: python tools/apply_singleflight_home_update.py
      - name: Focused regression
        run: |
          python -m pip install pytest >/dev/null
          python -m pytest -q website/tests/test_reading_singleflight_home_update.py website/tests/test_compact_spread_selector.py website/tests/test_public_ui_integrity.py
          python -m py_compile website/fortune_server.py
          node --check website/main.js
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/main.js website/index.html website/style.css website/public/locales_v10.json website/fortune_server.py website/tests/test_reading_singleflight_home_update.py
          git commit -m 'fix(reading): prevent duplicate submits and refresh home app'
          git push origin HEAD:fix/reading-singleflight-home-update
