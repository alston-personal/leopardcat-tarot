name: Fix Fan Canonical Geometry

on:
  push:
    branches: [feat/manual-fan-shuffle]
    paths:
      - '.github/workflows/fix-fan-geometry.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-fan-shuffle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use canonical fan x positions for hit testing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('website/main.js')
          s=p.read_text(encoding='utf-8')
          old="""    cards.forEach(button => {
                  const rect = button.getBoundingClientRect();
                  const center = rect.left + rect.width / 2;
                  const distance = Math.abs(clientX - center);
                  if (distance < bestDistance) { best = button; bestDistance = distance; }
              });"""
          new="""    const poolRect = pool.getBoundingClientRect();
              const poolCenter = poolRect.left + poolRect.width / 2;
              cards.forEach(button => {
                  const fanX = Number.parseFloat(button.style.getPropertyValue('--fan-x')) || 0;
                  const center = poolCenter + fanX;
                  const distance = Math.abs(clientX - center);
                  if (distance < bestDistance) { best = button; bestDistance = distance; }
              });"""
          if old not in s: raise SystemExit('fan hit algorithm anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('website/tests/manual_draw_browser.mjs')
          s=p.read_text(encoding='utf-8')
          old="""    const cardBox = await backs.nth(zeroBasedIndex).boundingBox();
              const poolBox = await pool.boundingBox();
              assert.ok(cardBox && poolBox);
              const x = cardBox.x + cardBox.width / 2;
              const y = poolBox.y + poolBox.height * 0.72;"""
          new="""    const poolBox = await pool.boundingBox();
              assert.ok(poolBox);
              const fanX = await backs.nth(zeroBasedIndex).evaluate(el => Number.parseFloat(el.style.getPropertyValue('--fan-x')) || 0);
              const x = poolBox.x + poolBox.width / 2 + fanX;
              const y = poolBox.y + poolBox.height * 0.72;"""
          if old not in s: raise SystemExit('browser fan x anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build check
        run: |
          cd website
          rm -f public/art/renders public/cards || true
          mkdir -p public/art/renders public/cards
          npm ci >/dev/null
          npm run build >/dev/null
      - name: Commit and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/tests/manual_draw_browser.mjs
          git add -f website/dist/index.html
          git rm .github/workflows/fix-fan-geometry.yml
          git commit -m 'fix(draw): align fan hit testing with fan geometry'
          git push origin HEAD:feat/manual-fan-shuffle
