name: Compile Nav Dropdown

on:
  push:
    branches: [fix/mobile-nav-dropdown]
    paths:
      - '.github/workflows/patch-nav-dropdown.yml'
      - 'tools/compile_nav_dropdown.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile dropdown and reachability guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compile_nav_dropdown.py
          cd website
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_mobile_nav_reachability.py tests/test_ui_locales.py
          node --check main.js
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/style.css website/tests/test_mobile_nav_reachability.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): preserve mobile nav and use locale dropdown'
          git push origin HEAD:fix/mobile-nav-dropdown
