name: Compile Card Scroll Contract

on:
  push:
    branches: [fix/card-scroll-contract]
    paths:
      - '.github/workflows/patch-card-scroll-contract.yml'
      - 'tools/compile_card_scroll_contract.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/patch-card-scroll-contract.yml
            tools/compile_card_scroll_contract.py
            website/main.js
            website/style.css
            website/tests
            website/package.json
            website/package-lock.json
      - name: Apply one scroll and flip contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 tools/compile_card_scroll_contract.py
          python3 -m py_compile website/tests/test_card_interaction_contract.py
          python3 -m pytest -q website/tests/test_card_interaction_contract.py
          node --check website/main.js
          cd website
          npm ci --ignore-scripts
          npm run build
      - name: Commit compiled fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/style.css website/tests/test_card_interaction_contract.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): unify card meaning scroll interactions'
          git push origin HEAD:fix/card-scroll-contract
