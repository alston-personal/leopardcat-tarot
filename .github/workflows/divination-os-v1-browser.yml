name: Divination OS v1 Browser
on:
  push:
    branches: [main, feature/creator-ownership]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build committed source
        run: |
          cd website
          rm -f public/art/renders public/cards || true
          mkdir -p public/art/renders public/cards
          npm ci >/dev/null
          npm run build >/dev/null
      - name: Start no-cost local server
        working-directory: website
        env:
          GEMINI_API_KEY: ''
        run: |
          nohup python fortune_server.py >/tmp/divination-v1-browser-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/api/v1/methods >/dev/null 2>&1 && exit 0; sleep 1; done
          cat /tmp/divination-v1-browser-server.log
          exit 1
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify focused reading UX
        run: |
          cat > v1-browser.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8088';
          const browser=await chromium.launch({headless:true});

          const page=await browser.newPage({viewport:{width:1280,height:900}});
          await page.goto(base+'/read.html?deck=leopardcat',{waitUntil:'networkidle'});
          assert.equal(await page.locator('[data-method="tarot"]').getAttribute('class'), 'active');
          await page.waitForFunction(()=>document.getElementById('persona-select').value==='leopardcat');
          assert.equal(await page.locator('#persona-select').inputValue(),'leopardcat');
          console.log('browser_tarot_deck_default_persona=passed');

          await page.locator('[data-method="lenormand"]').click();
          await page.waitForSelector('[data-spread="box9"]');
          await page.waitForFunction(()=>document.getElementById('persona-select').value==='master');
          assert.equal(await page.locator('#persona-select').inputValue(),'master');
          console.log('browser_lenormand_method_compatible_persona=passed');
          await page.locator('[data-spread="box9"]').click();
          await page.locator('#question').fill('接下來的整體局勢，我該注意什麼？');
          await page.locator('#draw').click();
          await page.waitForFunction(()=>!document.getElementById('result').classList.contains('hidden'));
          assert.equal(await page.locator('#cards .draw-card').count(),9);
          assert.ok(await page.locator('#structure').isVisible());
          assert.match(await page.locator('#structure').innerText(), /中心牌|相鄰組合/);
          assert.ok(await page.locator('#ai-fallback').isVisible());
          assert.ok(await page.locator('#handoff').isVisible());
          assert.equal(await page.locator('#provider-actions .provider-btn').count(),3);
          const capsuleText=await page.locator('#capsule-json').textContent();
          const capsule=JSON.parse(capsuleText||'{}');
          assert.equal(capsule.schema,'divination-reading/1');
          assert.equal(capsule.method,'lenormand');
          assert.equal(capsule.result.spread,'box9');
          assert.equal(capsule.result.cards.length,9);
          assert.equal(new Set(capsule.result.cards.map(x=>x.card_id)).size,9);
          assert.equal(capsule.contract.redraw_forbidden,true);
          console.log('browser_lenormand_box9_real_engine=passed');
          console.log('browser_zero_cost_result_survives=passed');
          console.log('browser_external_ai_handoff=passed');

          await page.goto(base+'/?deck=leopardcat',{waitUntil:'domcontentloaded'});
          const primary=page.locator('[data-primary-reading]').first();
          assert.match(await primary.getAttribute('href'), /\/read\.html/);
          console.log('browser_progressive_disclosure_entry=passed');

          const mobile=await browser.newPage({viewport:{width:375,height:812}});
          await mobile.goto(base+'/read.html?method=lenormand',{waitUntil:'networkidle'});
          assert.ok(await mobile.locator('#question').isVisible());
          assert.ok(await mobile.locator('#draw').isVisible());
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(overflow<=1,`horizontal overflow ${overflow}px`);
          console.log('browser_mobile_reading_layout=passed');

          const createResp=await fetch(base+'/api/v1/personas',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:'Browser 管理測試師',role:'E2E 測試',voice:'溫柔',principles:'忠實解讀'})
          });
          assert.equal(createResp.status,201);
          const created=await createResp.json();
          assert.ok(created.persona_id && created.management_token);
          const personaId=created.persona_id;
          const oldToken=created.management_token;

          const manage=await browser.newPage({viewport:{width:900,height:900}});
          await manage.addInitScript(()=>{ window.confirm=()=>true; window.prompt=()=> 'DELETE'; });
          const seenManageRequests=[];
          manage.on('request',req=>{
            if(req.url().includes(`/api/v1/manage/personas/${personaId}`)){
              seenManageRequests.push(req.url());
              assert.ok(!req.url().includes(oldToken));
              assert.ok(!new URL(req.url()).searchParams.has('token'));
              assert.equal(req.headers()['x-management-token'],oldToken);
            }
          });
          await manage.goto(`${base}/manage.html?persona=${encodeURIComponent(personaId)}#token=${encodeURIComponent(oldToken)}`,{waitUntil:'networkidle'});
          await manage.waitForFunction(()=>!document.getElementById('editor').classList.contains('hidden'));
          assert.equal(await manage.locator('#persona-name').inputValue(),'Browser 管理測試師');
          await manage.locator('#persona-name').fill('Browser 管理測試師 v2');
          await manage.locator('#save').click();
          await manage.waitForFunction(()=>document.getElementById('status').textContent.includes('已儲存'));
          assert.equal(await manage.locator('#persona-name').inputValue(),'Browser 管理測試師 v2');
          await manage.locator('#rotate').click();
          await manage.waitForFunction(()=>!document.getElementById('rotated').classList.contains('hidden'));
          const newUrl=await manage.locator('#new-manage-link').getAttribute('href');
          const parsed=new URL(newUrl);
          assert.equal(parsed.searchParams.get('persona'),personaId);
          assert.equal(parsed.searchParams.get('token'),null);
          const newToken=new URLSearchParams(parsed.hash.slice(1)).get('token');
          assert.ok(newToken && newToken!==oldToken);
          assert.ok(seenManageRequests.length>=3);

          const oldCheck=await fetch(`${base}/api/v1/manage/personas/${encodeURIComponent(personaId)}`,{headers:{'X-Management-Token':oldToken}});
          assert.equal(oldCheck.status,403);
          const newCheck=await fetch(`${base}/api/v1/manage/personas/${encodeURIComponent(personaId)}`,{headers:{'X-Management-Token':newToken}});
          assert.equal(newCheck.status,200);
          const newInfo=await newCheck.json();
          assert.equal(newInfo.name,'Browser 管理測試師 v2');
          const cleanup=await fetch(`${base}/api/v1/manage/personas/${encodeURIComponent(personaId)}`,{method:'DELETE',headers:{'X-Management-Token':newToken}});
          assert.equal(cleanup.status,200);
          console.log('browser_management_header_only_secret=passed');
          console.log('browser_management_edit_rotate_real_server=passed');
          console.log('browser_management_old_token_revoked=passed');

          await browser.close();
          NODE
          node v1-browser.mjs
