name: Divination OS v1 Browser
on:
  push:
    branches: [feature/creator-ownership]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/creator-ownership}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply integration and build
        run: |
          python tools/patch_divination_os_v1_server.py
          python tools/patch_creator_ownership_ui.py
          python tools/patch_primary_reading_cta.py
          cd website
          rm -f public/art/renders public/cards || true
          mkdir -p public/art/renders public/cards
          npm ci >/dev/null
          npm run build >/dev/null
      - name: Start no-cost local server
        working-directory: website
        env:
          GEMINI_API_KEY: ''
        run: |
          nohup python fortune_server.py >/tmp/divination-v1-browser-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/api/v1/methods >/dev/null 2>&1 && exit 0; sleep 1; done
          cat /tmp/divination-v1-browser-server.log
          exit 1
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify focused reading UX
        run: |
          cat > v1-browser.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8088';
          const browser=await chromium.launch({headless:true});

          // Real Lenormand engine + real 503 zero-cost fallback.
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          await page.goto(base+'/read.html',{waitUntil:'networkidle'});
          assert.equal(await page.locator('[data-method="tarot"]').getAttribute('class'), 'active');
          await page.locator('[data-method="lenormand"]').click();
          await page.waitForSelector('[data-spread="box9"]');
          await page.locator('[data-spread="box9"]').click();
          await page.locator('#question').fill('接下來的整體局勢，我該注意什麼？');
          await page.locator('#draw').click();
          await page.waitForFunction(()=>!document.getElementById('result').classList.contains('hidden'));
          assert.equal(await page.locator('#cards .draw-card').count(),9);
          assert.ok(await page.locator('#structure').isVisible());
          assert.match(await page.locator('#structure').innerText(), /中心牌|相鄰組合/);
          assert.ok(await page.locator('#ai-fallback').isVisible());
          assert.ok(await page.locator('#handoff').isVisible());
          assert.equal(await page.locator('#provider-actions .provider-btn').count(),3);
          const capsule=JSON.parse(await page.locator('#capsule-json').innerText());
          assert.equal(capsule.schema,'divination-reading/1');
          assert.equal(capsule.method,'lenormand');
          assert.equal(capsule.result.spread,'box9');
          assert.equal(capsule.result.cards.length,9);
          assert.equal(new Set(capsule.result.cards.map(x=>x.card_id)).size,9);
          assert.equal(capsule.contract.redraw_forbidden,true);
          console.log('browser_lenormand_box9_real_engine=passed');
          console.log('browser_zero_cost_result_survives=passed');
          console.log('browser_external_ai_handoff=passed');

          // Root experience must route primary use into the focused reading page.
          await page.goto(base+'/?deck=leopardcat',{waitUntil:'domcontentloaded'});
          const primary=page.locator('[data-primary-reading]').first();
          assert.match(await primary.getAttribute('href'), /\/read\.html/);
          console.log('browser_progressive_disclosure_entry=passed');

          // Mobile: question + CTA usable, no horizontal overflow.
          const mobile=await browser.newPage({viewport:{width:375,height:812}});
          await mobile.goto(base+'/read.html?method=lenormand',{waitUntil:'networkidle'});
          assert.ok(await mobile.locator('#question').isVisible());
          assert.ok(await mobile.locator('#draw').isVisible());
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(overflow<=1,`horizontal overflow ${overflow}px`);
          console.log('browser_mobile_reading_layout=passed');

          // Manage UI: secret remains in fragment and is sent only via header.
          const manage=await browser.newPage({viewport:{width:900,height:900}});
          let getSeen=false, patchSeen=false, rotateSeen=false;
          await manage.route('**/api/v1/manage/decks/browser-owned**', async route=>{
            const req=route.request();
            assert.ok(!req.url().includes('secret-browser-token'));
            assert.equal(req.headers()['x-management-token'],'secret-browser-token');
            if(req.url().endsWith('/rotate')){
              rotateSeen=true;
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({management_token:'new-secret-token',manage_path:'/manage.html?deck=browser-owned'})});
            }
            if(req.method()==='PATCH'){
              patchSeen=true;
              const body=JSON.parse(req.postData()||'{}');
              assert.equal(body.name,'新版牌組名稱');
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({resource_type:'deck',deck_id:'browser-owned',name:'新版牌組名稱',creator:'Creator',description:'Desc',default_persona:'master',card_count:22,reversals:true})});
            }
            getSeen=true;
            return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({resource_type:'deck',deck_id:'browser-owned',name:'舊牌組',creator:'Creator',description:'Desc',default_persona:'master',card_count:22,reversals:true})});
          });
          await manage.goto(base+'/manage.html?deck=browser-owned#token=secret-browser-token',{waitUntil:'networkidle'});
          assert.ok(getSeen);
          await manage.locator('#deck-name').fill('新版牌組名稱');
          await manage.locator('#save').click();
          await manage.waitForFunction(()=>document.getElementById('status').textContent.includes('已儲存'));
          assert.ok(patchSeen);
          manage.once('dialog',d=>d.accept());
          await manage.locator('#rotate').click();
          await manage.waitForFunction(()=>!document.getElementById('rotated').classList.contains('hidden'));
          assert.ok(rotateSeen);
          const newUrl=await manage.locator('#new-manage-link').getAttribute('href');
          const parsed=new URL(newUrl);
          assert.equal(parsed.searchParams.get('deck'),'browser-owned');
          assert.equal(parsed.searchParams.get('token'),null);
          assert.equal(new URLSearchParams(parsed.hash.slice(1)).get('token'),'new-secret-token');
          console.log('browser_management_header_only_secret=passed');
          console.log('browser_management_edit_rotate=passed');

          await browser.close();
          NODE
          node v1-browser.mjs
