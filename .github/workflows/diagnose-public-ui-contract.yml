name: Diagnose Public UI Contract
on:
  push:
    branches: [fix/public-ui-integrity]
    paths: ['.github/workflows/diagnose-public-ui-contract.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install -q pytest
          cd website
          python3 -m pytest -q tests > ../contract-failure.txt 2>&1 || true
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contract-failure.txt
          git commit -m 'ci: capture contract failure' || true
          git push origin HEAD:fix/public-ui-integrity
