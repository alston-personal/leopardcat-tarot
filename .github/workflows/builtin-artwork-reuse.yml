name: Builtin Artwork Reuse
on:
  push:
    branches: [feature/issue-80-reuse-leopardcat-images]
  pull_request:
    paths:
      - "website/divination/publishing.py"
      - "website/public/creator.js"
      - "website/public/create.html"
      - "website/tests/test_builtin_artwork_reuse.py"
      - ".github/workflows/builtin-artwork-reuse.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - run: python -m compileall -q website/divination
      - run: node --check website/public/creator.js
      - run: cd website && python -m pytest -q tests/test_builtin_artwork_reuse.py
      - name: Observe real production artwork availability
        shell: bash
        run: |
          for path in /manifest.json /art/renders/card-00-the-fool.png; do
            printf 'LIVE_PROBE_PATH=%s ' "$path"
            curl --max-time 12 -L -sS -o /tmp/live-art-probe -w 'HTTP=%{http_code} BYTES=%{size_download} TYPE=%{content_type}\\n' "https://leopardcat-tarot.milkcat.org$path" || echo "CURL_UNAVAILABLE"
          done
