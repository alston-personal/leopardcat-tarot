name: Builtin Artwork Reuse
on:
  push:
    branches: [feature/issue-80-reuse-leopardcat-images]
  pull_request:
    paths:
      - "website/divination/publishing.py"
      - "website/public/creator.js"
      - "website/public/create.html"
      - "website/tests/test_builtin_artwork_reuse.py"
      - ".github/workflows/builtin-artwork-reuse.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - run: python -m compileall -q website/divination
      - run: node --check website/public/creator.js
      - run: cd website && python -m pytest -q tests/test_builtin_artwork_reuse.py tests/test_ocean_current_master.py
      - name: Observe real production artwork availability
        shell: bash
        run: |
          for path in /manifest.json /art/renders/card-00-the-fool.png; do
            printf 'LIVE_PROBE_PATH=%s ' "$path"
            curl --max-time 12 -L -sS -o /tmp/live-art-probe -w 'HTTP=%{http_code} BYTES=%{size_download} TYPE=%{content_type}\\n' "https://leopardcat-tarot.milkcat.org$path" || echo "CURL_UNAVAILABLE"
          done
      - name: Observe deployed creator feature (read-only)
        shell: bash
        run: |
          code=$(curl -L -sS --max-time 15 -o /tmp/live-create.html -w '%{http_code}' https://leopardcat-tarot.milkcat.org/create.html || true)
          echo "LIVE_CREATOR_HTTP=$code"
          if [ "$code" = "200" ] && grep -q 'value="leopardcat"' /tmp/live-create.html; then
            echo "LIVE_BUILTIN_CARD_OPTION=present"
          else
            echo "LIVE_BUILTIN_CARD_OPTION=missing_or_unreachable"
          fi
      - name: Verify live guide catalog (read only)
        run: |
          curl -fLsS --max-time 20 'https://leopardcat-tarot.milkcat.org/api/v1/personas?deck=leopardcat' -o /tmp/personas.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/personas.json'))
          ids=[p.get('persona_id') for p in d.get('personas',[])]
          print('LIVE_PERSONA_IDS='+','.join(ids))
          print('LIVE_OCEAN_CURRENT_MASTER='+str('ocean-current-master' in ids))
          PY
