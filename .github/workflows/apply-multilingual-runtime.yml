name: Apply Multilingual Runtime Restoration

on:
  push:
    branches:
      - fix/restore-i18n-governance
    paths:
      - tools/restore_multilingual_runtime.py
      - tools/audit_i18n_history.py
      - .github/workflows/apply-multilingual-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-i18n-governance
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: git fetch --all --tags --prune
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce capability contracts
        run: |
          python scripts/check_capability_regressions.py
          python scripts/check_capability_ledger_monotonic.py
      - name: Verify restored runtime remains data-driven
        run: |
          ! grep -F "['zh', 'en'].includes(window.currentLang)" website/main.js
          grep -F 'id="lang-switcher"' website/index.html
          grep -F 'function resolveLocale(requested)' website/main.js
      - name: Audit complete website history
        run: python tools/audit_i18n_history.py
      - name: Commit canonical audit evidence if changed
        run: |
          if [ -z "$(git status --porcelain -- docs/i18n-history-audit.md)" ]; then
            echo "Audit report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/i18n-history-audit.md
          git commit -m "docs(i18n): record full-history multilingual audit"
          git push origin HEAD:fix/restore-i18n-governance
