name: Apply Master Spread Planner

on:
  push:
    branches: [feat/master-spread-planner]
    paths:
      - 'tools/patch_master_spread_planner.py'
      - '.github/workflows/apply-master-spread-planner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/master-spread-planner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded patch
        run: python tools/patch_master_spread_planner.py
      - name: Validate syntax and focused planner behavior
        run: |
          python -m py_compile website/fortune_server.py website/divination/tarot.py
          node --check website/main.js
          python - <<'PY'
          import sys
          sys.path.insert(0, 'website')
          from divination.tarot import SPREADS, plan_spread, spread_catalog
          assert len(SPREADS) >= 9
          assert plan_spread('我們的感情關係接下來會怎麼發展？')['spread'] == 'relationship'
          assert plan_spread('我最近工作是否該換跑道？')['spread'] == 'career'
          assert plan_spread('請幫我完整分析目前非常複雜的整體局勢與未來可能性')['spread'] in {'celtic_cross','three_card'}
          assert len(spread_catalog()) == len(SPREADS)
          print('master_spread_planner_focus=PASS')
          PY
      - name: Commit generated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/index.html website/fortune_server.py
          if git diff --cached --quiet; then
            echo 'No generated product changes required.'
            exit 0
          fi
          git commit -m 'feat(divination): route auto spread planning through server authority'
          git push origin HEAD:feat/master-spread-planner
