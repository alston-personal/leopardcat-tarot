name: Compile Mobile Nav V3

on:
  push:
    branches: [fix/mobile-nav-dropdown-clean]
    paths:
      - '.github/workflows/patch-mobile-nav-v3.yml'
      - 'tools/compile_mobile_nav_v3.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile governed nav fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 tools/compile_mobile_nav_v3.py
          cd website
          python3 -m pytest -q tests/test_mobile_nav_reachability.py tests/test_ui_locales.py
          node --check main.js
          cd ..
          python3 scripts/check_capability_regressions.py
      - name: Commit product and governance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/main.js website/style.css website/tests/test_mobile_nav_reachability.py governance/capabilities.json scripts/check_capability_regressions.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): preserve mobile nav with locale dropdown'
          git push origin HEAD:fix/mobile-nav-dropdown-clean
