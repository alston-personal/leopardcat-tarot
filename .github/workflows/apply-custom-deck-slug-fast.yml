name: Apply Custom Deck Slug Fast
on:
  push:
    branches: [feature/custom-deck-slug]
    paths: [.github/workflows/apply-custom-deck-slug-fast.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            website/divination
            website/fortune_server.py
            website/public/create.html
            website/public/creator.js
            tools/patch_custom_deck_slug.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/patch_custom_deck_slug.py
      - name: Validate
        run: |
          python -m py_compile website/fortune_server.py website/divination/*.py
          node --check website/public/creator.js
          python - <<'PY'
          import tempfile, sys
          from pathlib import Path
          sys.path.insert(0, 'website')
          from divination.publishing import DeckPublisher
          t=tempfile.TemporaryDirectory(); p=DeckPublisher(t.name)
          assert p.slug_available('moon-garden')['available'] is True
          (Path(t.name)/'moon-garden').mkdir()
          assert p.slug_available('moon-garden')['available'] is False
          assert p.slug_available('admin')['reserved'] is True
          assert p.slug_available('ab')['valid'] is False
          print('slug_policy_tests=passed')
          PY
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/divination/publishing.py website/fortune_server.py website/public/create.html website/public/creator.js
          if git diff --cached --quiet; then echo no_changes=true; exit 0; fi
          git commit -m 'feat(deck): allow custom share URLs'
          git push origin HEAD:feature/custom-deck-slug
