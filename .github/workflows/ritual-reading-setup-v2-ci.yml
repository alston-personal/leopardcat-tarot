name: Ritual Reading Setup v2 CI
on:
  push:
    branches: [feat/ritual-reading-setup-v2]
    paths:
      - 'tools/apply_ritual_setup_v2.py'
      - '.github/workflows/ritual-reading-setup-v2-ci.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply v2 styling
        run: python tools/apply_ritual_setup_v2.py
      - name: Focused regression
        run: python -m pytest website/tests/test_reading_setup_v2.py -q
      - name: Commit product changes
        run: |
          git config user.name 'Sunlake'
          git config user.email 'register@milkcat.org'
          git add website/style.css website/tests/test_reading_setup_v2.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ui): turn reading setup into ritual flow'
            git push origin HEAD:feat/ritual-reading-setup-v2
          fi
